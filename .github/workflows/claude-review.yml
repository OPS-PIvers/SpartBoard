name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main
      - dev-*
    # Mirror pr-validation: skip docs-only PRs. The nightly agent fleet opens
    # many journal-only PRs (docs/routines/*.md); reviewing Markdown burns
    # subscription usage for no benefit. A PR touching any non-doc file still
    # gets reviewed (paths-ignore only skips when *every* changed file matches).
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

# Cancel a superseded run when a newer commit lands on the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-24.04
    name: Claude Code Review
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # The reviewer cannot shell out for this itself: a redirect matches no
      # prefix rule, and paths outside the workspace are denied.
      - name: Save the PR diff for the reviewer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr diff "${{ github.event.pull_request.number }}" > pr.diff

      - name: Claude review
        id: claude_review
        uses: anthropics/claude-code-action@v1
        with:
          # PRs opened by the claude[bot] app are still ours to review.
          allowed_bots: 'claude'
          # Pro/Max subscription auth - generate locally with `claude setup-token`
          # and store as a repo secret. No metered API key required.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request (a React + TypeScript + Firebase app, pnpm
            monorepo). Focus on:
            - Correctness bugs and logic errors
            - Security issues (auth, Firestore rules, secret handling, XSS)
            - Performance regressions
            - Adherence to existing patterns and conventions in the repo

            Be concise and high-signal: only flag things that genuinely matter.
            If the PR looks good, say so briefly rather than inventing nitpicks.

            The PR branch is checked out in the working directory, and the
            complete diff is already saved there as `pr.diff`. Read that file
            with the Read tool and search it with the Grep tool. Do not
            regenerate it with `git diff` or `gh pr diff`.

            Your shell is restricted to a prefix allowlist, so keep Bash calls
            to a single simple command. A redirect (`>`, `>>`, `tee`) matches
            no rule, nor does a path outside the working directory: both are
            denied outright, and enough denials end the review with nothing
            posted. Anything you would reach for a redirect to do, the Read and
            Grep tools already do without one.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for specific line-level issues.
            Only post GitHub comments - do not return review text as a message.

          # Read-only tools only: nothing here can write a tracked file, push, or reach the network.
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Read,Grep,Glob,Task,TodoWrite,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(git status:*),Bash(git ls-files:*),Bash(git merge-base:*),Bash(git rev-parse:*),Bash(git fetch origin:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(ls:*),Bash(wc:*),Bash(grep:*),Bash(rg:*),Bash(sed -n:*)"

      # The action hides the SDK output, so denied tool names are otherwise unrecoverable.
      - name: Report review tool use
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude_review.outputs.execution_file }}
        run: |
          set -uo pipefail
          FILE="${EXECUTION_FILE:-}"
          if [ -z "$FILE" ] || [ ! -f "$FILE" ]; then
            FILE="${RUNNER_TEMP}/claude-execution-output.json"
          fi
          if [ ! -f "$FILE" ]; then
            echo "::warning title=Claude review did not run::No execution log. The action skipped - this workflow file differs from main's copy, or the actor gate blocked it."
            exit 0
          fi
          jq -s 'flatten(1)' "$FILE" > "${RUNNER_TEMP}/claude-exec-flat.json" || exit 0
          EXEC="${RUNNER_TEMP}/claude-exec-flat.json"
          TURNS=$(jq -r '(map(select(.type == "result")) | last | .num_turns) // 0' "$EXEC")
          MS=$(jq -r '(map(select(.type == "result")) | last | .duration_ms) // 0' "$EXEC")
          # The saved result message does not always carry the count, so take the longer of the two.
          DENIALS=$(jq -r '[([.. | objects | (.permission_denials? // empty) | .[]] | length),
                            ((map(select(.type == "result")) | last | .permission_denials_count) // 0)] | max' "$EXEC")
          echo "result: turns=$TURNS denials=$DENIALS duration_ms=$MS"
          echo "tools used:"
          jq -r '[.. | objects | select(.type? == "tool_use") | .name]
                 | group_by(.) | map("  \(.[0]) x\(length)")
                 | if length == 0 then ["  (none)"] else . end | .[]' "$EXEC"
          echo "tool calls denied:"
          jq -r '[.. | objects | (.permission_denials? // empty) | .[]]
                 | map("  \(.tool_name) \((.tool_input.command // .tool_input.file_path // .tool_input.pattern // "") | tostring | .[0:120])")
                 | unique | if length == 0 then ["  (none)"] else . end | .[]' "$EXEC"
          if [ "$DENIALS" -gt 0 ] || [ "$TURNS" -le 2 ]; then
            echo "::warning title=Claude review may not have reviewed this PR::turns=$TURNS denials=$DENIALS. A real review takes many turns and posts a comment; read the log rather than the green check."
          fi
