name: PR Validation

on:
  pull_request:
    branches:
      - main
      - dev-*
    # No paths-ignore: `summary` is a required check, so it must report on every PR. Docs-only PRs
    # (the nightly journal PRs) pass in seconds via the `changes` job instead.

# Cancel a superseded run when a newer commit is pushed to the same PR, so
# rapid successive pushes don't each run the full suite to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: write

env:
  VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'test-key' }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || 'test.firebaseapp.com' }}
  VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || 'test-project' }}
  VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || 'test.appspot.com' }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '123456789' }}
  VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || '1:123456789:web:abc123' }}
  VITE_OPENWEATHER_API_KEY: ${{ secrets.VITE_OPENWEATHER_API_KEY || 'test-key' }}
  VITE_PEXELS_API_KEY: ${{ secrets.VITE_PEXELS_API_KEY || 'test-key' }}

jobs:
  # Markdown and docs/ never affect the build, tests or rules. A release PR (dev-paul into main)
  # skips the widget grader: every feature PR into dev-paul already ran it on its own diff.
  changes:
    runs-on: ubuntu-24.04
    name: Classify changes
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      release: ${{ steps.classify.outputs.release }}
    steps:
      - id: classify
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const docsOnly = files.length > 0 && files.every((f) => f.filename.endsWith('.md') || f.filename.startsWith('docs/'));
            const release = pr.base.ref === 'main' && pr.head.ref === 'dev-paul';
            core.info(`${files.length} files; docs only: ${docsOnly}; release PR: ${release}`);
            core.setOutput('docs_only', String(docsOnly));
            core.setOutput('release', String(release));

  # A dev-* push already ran lint, type-check, unit tests, rules tests and the build on this exact
  # commit. When that run succeeds (waiting for it if it's still going), only E2E runs here.
  preflight:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    name: Check for prior dev-branch validation
    outputs:
      reuse: ${{ steps.check.outputs.reuse }}
    steps:
      - id: check
        uses: actions/github-script@v7
        with:
          script: |
            const headSha = context.payload.pull_request.head.sha;
            const list = async () =>
              (
                await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'firebase-dev-deploy.yml',
                  head_sha: headSha,
                  event: 'push',
                  per_page: 5,
                })
              ).data.workflow_runs;
            // A release PR is usually opened while dev-paul's own run is still going: wait up to 25 min for it.
            let runs = await list();
            for (let i = 0; i < 50 && !runs.some((r) => r.conclusion === 'success') && runs.some((r) => r.status !== 'completed'); i++) {
              core.info(`Waiting for the in-progress dev-branch run on ${headSha}...`);
              await new Promise((r) => setTimeout(r, 30000));
              runs = await list();
            }
            const run = runs.find((r) => r.conclusion === 'success');
            if (run) {
              core.info(`Reusing dev-branch validation for ${headSha}: ${run.html_url}`);
              await core.summary
                .addHeading('Validation reused')
                .addRaw(`Lint, type-check, unit tests, rules tests and build already passed on this commit in [the dev-branch run](${run.html_url}). Only E2E runs here.`)
                .write();
            } else {
              core.info(`No successful dev-branch run found for ${headSha}; running the full suite.`);
            }
            core.setOutput('reuse', run ? 'true' : 'false');

  quality:
    needs: preflight
    if: needs.preflight.result == 'success' && needs.preflight.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    name: Code Quality (${{ matrix.check }})
    strategy:
      fail-fast: false
      matrix:
        check: [lint-app, lint-functions, format, type-check]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup

      # Type-aware ESLint holds a ~4.5GB TS program; 5120MB leaves headroom.
      # No --concurrency: ESLint's worker threads don't inherit NODE_OPTIONS
      # (each gets Node's own default heap ceiling), so a worker touching this
      # program would hit an unraised limit and get OOM-killed — see
      # tests/ci.eslintConcurrencyMemory.test.ts.
      - if: matrix.check == 'lint-app'
        run: NODE_OPTIONS=--max-old-space-size=5120 pnpm run lint:app
      - if: matrix.check == 'lint-functions'
        run: pnpm run lint:functions
      - if: matrix.check == 'format'
        run: pnpm run format:check
      - if: matrix.check == 'type-check'
        run: pnpm run type-check:all

  # The root suite is ~840 jsdom files; sharding across runners cuts wall time
  # roughly by the shard count. Each shard uploads its JSON report so the
  # test-counts job can merge them and apply the silent-omission guard.
  test:
    needs: preflight
    if: needs.preflight.result == 'success' && needs.preflight.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    name: Unit Tests (shard ${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: pnpm run test:shard --shard=${{ matrix.shard }}/3 --outputFile=.vitest-reports/root-shard-${{ matrix.shard }}.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-report-shard-${{ matrix.shard }}
          path: .vitest-reports/root-shard-${{ matrix.shard }}.json
          retention-days: 1

  # Functions suite (~5s) plus the merged-shard count guard from scripts/checkTestCounts.mjs.
  test-counts:
    needs: test
    runs-on: ubuntu-24.04
    name: Unit Tests (functions + count guard)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup

      - uses: actions/download-artifact@v4
        with:
          pattern: vitest-report-shard-*
          path: .vitest-reports/shards
          merge-multiple: true

      - run: pnpm run test:merge-reports .vitest-reports/root.json .vitest-reports/shards/root-shard-*.json
      - run: pnpm -C functions test
      - run: pnpm run test:counts

  e2e:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.0-jammy
      options: --shm-size=1g
    name: E2E Tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # The pnpm cache never restores inside the Playwright container and the
      # post-step re-uploads it every run (35-70s); a cold install is ~16s.
      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup
        with:
          cache: ''

      - name: Run E2E tests
        run: pnpm run test:e2e
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID || 'test-client-id' }}
          VITE_AUTH_BYPASS: 'true'

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # Widget grader gates (docs/plans/WIDGET_RUBRIC.md R23) on the widgets this PR touches;
  # shared window, config or harness changes check every widget. Fails only on gate
  # failures missing from docs/widget-rubric/gate-baseline.json.
  widget-grader-gates:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.release != 'true'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.0-jammy
      options: --shm-size=1g
    name: Widget Grader Gates
    timeout-minutes: 150
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup
        with:
          cache: ''

      - name: Find affected widgets
        id: affected
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          node scripts/widget-grader/affected.ts --base "origin/${{ github.base_ref }}"

      - name: Run gate checks
        if: steps.affected.outputs.mode != 'none'
        run: node scripts/widget-grader/run.ts --gates-only --check-baseline --run-id ci ${TYPES:+--type "$TYPES"}
        env:
          TYPES: ${{ steps.affected.outputs.types }}
          VITE_AUTH_BYPASS: 'true'
          GRADER_WORKERS: '4'

      - name: Upload grader report
        if: always() && steps.affected.outputs.mode != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: widget-grader-gates
          path: |
            scripts/widget-grader/out/ci/summary.md
            scripts/widget-grader/out/ci/gate-report.json
            scripts/widget-grader/out/ci/measurements/
          retention-days: 14

  rules:
    needs: preflight
    if: needs.preflight.result == 'success' && needs.preflight.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    name: Firestore Rules Tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup

      # firebase-tools is in the root lockfile (pnpm exec firebase).
      # The Firestore emulator is a Java process, so we need a JDK.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Firestore emulator jar
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: firebase-emulators-${{ runner.os }}-

      - name: Run Firestore rules tests
        run: pnpm run test:rules

  build:
    needs: preflight
    if: needs.preflight.result == 'success' && needs.preflight.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    name: Build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup

      - name: Build project
        run: pnpm run build:all

  summary:
    needs:
      [
        changes,
        preflight,
        quality,
        test,
        test-counts,
        rules,
        build,
        e2e,
        widget-grader-gates,
      ]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Add PR Comment
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PR_COMMENT_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const reused = '${{ needs.preflight.outputs.reuse }}' === 'true';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: reused
                ? '✅ All validation checks passed (lint, types, unit and rules tests reused from the dev-branch run on this commit; E2E ran here).'
                : '✅ All validation checks passed! Code quality looks good.'
            })

      - name: Add PR Comment on Failure
        if: ${{ contains(needs.*.result, 'failure') }}
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PR_COMMENT_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Validation checks failed. Please review the workflow logs and fix the issues before merging.'
            })

      # The required check: fail when any job failed or was cancelled (skipped is fine).
      - name: Fail when a check failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::One or more validation jobs failed or were cancelled."
          exit 1
