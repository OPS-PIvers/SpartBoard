name: Publish Chrome Extension

# A version bump in extension/manifest.json on main publishes the prod listing after Paul approves the run; the dev
# listing is uploaded by hand so no unreviewed run holds the Web Store token (docs/plans/CHROME_EXTENSION.md D7).
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - id: plan
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Publishing runs only from main (prod listing). Upload dev builds by hand (extension/README.md, \"Publishing\")."
            exit 1
          fi
          version_of() { node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).version??"")}catch{console.log("")}})'; }
          version=$(version_of < extension/manifest.json)
          publish=true
          if [[ "$EVENT" == push ]]; then
            previous=""
            if [[ -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]] && git fetch -q --depth=1 origin "$BEFORE"; then
              previous=$(git show "$BEFORE:extension/manifest.json" 2>/dev/null | version_of)
            fi
            if [[ -z "$previous" ]]; then
              publish=false
              echo "::notice::Couldn't read the previous version, so nothing was published. If $version is new, run this workflow by hand."
            elif ! node -e 'const p=v=>v.split(".").map(Number),[a,b]=[p(process.argv[1]),p(process.argv[2])];for(let i=0;i<4;i++){const d=(a[i]??0)-(b[i]??0);if(d)process.exit(d>0?0:1)}process.exit(1)' "$version" "$previous"; then
              publish=false
              echo "The extension version is $version (was $previous); nothing to publish."
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # GitHub creates a missing environment with no protection, so prod refuses to run until Paul is its required reviewer.
  prod-guard:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reviewers=$(gh api "repos/$GITHUB_REPOSITORY/environments/chrome-web-store-prod" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length') || reviewers=""
          if [[ ! "$reviewers" =~ ^[0-9]+$ || "$reviewers" -lt 1 ]]; then
            echo "::error::The chrome-web-store-prod environment is missing or has no required reviewer, so the prod listing was not published. Add Paul as its required reviewer (extension/README.md, \"Publishing\"), then run this workflow again from main."
            exit 1
          fi

  publish:
    needs: [plan, prod-guard]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    name: Publish prod listing ${{ needs.plan.outputs.version }}
    environment: chrome-web-store-prod
    # Only real bumps queue here, so a newer one replacing a waiting one is still the later version.
    concurrency:
      group: ${{ github.workflow }}-prod
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup

      - name: Build and zip the extension
        run: pnpm run build:extension

      - name: Upload to the Web Store and submit for review
        working-directory: extension
        env:
          CWS_ENVIRONMENT: chrome-web-store-prod
          SPART_EXTENSION_ID: ${{ vars.SPART_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: node scripts/publish.ts prod

      - name: Keep the published zip
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-prod-${{ needs.plan.outputs.version }}
          path: extension/dist/spartboard-extension-prod-*.zip
          if-no-files-found: error
          retention-days: 90
