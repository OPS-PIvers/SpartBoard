name: Deploy Dev Branches to spartboard-dev

on:
  push:
    branches:
      - 'dev-*'
  workflow_dispatch:

# Concurrency is per job, not per workflow: a newer push cancels superseded checks, but a deploy
# that has started always finishes (the newest pending deploy waits behind it). workflow_dispatch
# re-runs a deploy from the Actions tab.

# Build and deploy add id-token: write for keyless Workload Identity Federation into spartboard-dev.
permissions:
  contents: read

env:
  VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
  VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
  VITE_OPENWEATHER_API_KEY: ${{ secrets.VITE_OPENWEATHER_API_KEY }}
  VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
  VITE_PEXELS_API_KEY: ${{ secrets.VITE_PEXELS_API_KEY }}
  VITE_SPOTIFY_CLIENT_ID: ${{ secrets.VITE_SPOTIFY_CLIENT_ID }}
  DEV_PROJECT_ID: spartboard-dev
  DEV_WEB_APP_ID: '1:258543092004:web:63b9aa080a08cd83c973b1'
  DEV_WIF_PROVIDER: projects/258543092004/locations/global/workloadIdentityPools/github/providers/spartboard-repo
  DEV_DEPLOY_SA: github-deploy@spartboard-dev.iam.gserviceaccount.com

jobs:
  # The app ESLint pass (type-aware, ~3.5 min), the functions ESLint pass and
  # Prettier each get their own runner instead of running back to back.
  lint:
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-lint-${{ matrix.check }}
      cancel-in-progress: true
    name: lint (${{ matrix.check }})
    strategy:
      fail-fast: false
      matrix:
        check: [app, functions, format]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      # Type-aware ESLint holds a ~4.5GB TS program; 5120MB leaves headroom.
      # No --concurrency: ESLint's worker threads don't inherit NODE_OPTIONS
      # (each gets Node's own default heap ceiling), so a worker touching this
      # program would hit an unraised limit and get OOM-killed — see
      # tests/ci.eslintConcurrencyMemory.test.ts.
      - if: matrix.check == 'app'
        run: NODE_OPTIONS=--max-old-space-size=5120 pnpm run lint:app
      - if: matrix.check == 'functions'
        run: pnpm run lint:functions
      - if: matrix.check == 'format'
        run: pnpm run format:check

  type-check:
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-type-check
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: pnpm run type-check:all

  # The root suite is ~840 jsdom files; sharding across runners cuts wall time
  # roughly by the shard count. Each shard uploads its JSON report so the
  # test-counts job can merge them and apply the silent-omission guard.
  test:
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-test-${{ matrix.shard }}
      cancel-in-progress: true
    name: test (shard ${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: pnpm run test:shard --shard=${{ matrix.shard }}/3 --outputFile=.vitest-reports/root-shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-report-shard-${{ matrix.shard }}
          path: .vitest-reports/root-shard-${{ matrix.shard }}.json
          retention-days: 1

  # Functions suite (~5s) plus the merged-shard count guard from scripts/checkTestCounts.mjs.
  test-counts:
    needs: test
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-test-counts
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          pattern: vitest-report-shard-*
          path: .vitest-reports/shards
          merge-multiple: true
      - run: pnpm run test:merge-reports .vitest-reports/root.json .vitest-reports/shards/root-shard-*.json
      - run: pnpm -C functions test
      - run: pnpm run test:counts

  # test:all doesn't include test:rules; without this a firestore.rules regression could reach a preview deploy unverified.
  rules:
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-rules
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      # The Firestore emulator is a Java process, so we need a JDK.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Firestore emulator jar
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: firebase-emulators-${{ runner.os }}-
      - name: Run Firestore rules tests
        run: pnpm run test:rules

  # Dev's public web config (repo VITE_FIREBASE_* secrets are prod's), fetched apart from build so no build code sees the deploy credential.
  web-config:
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-web-config
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.DEV_WIF_PROVIDER }}
          service_account: ${{ env.DEV_DEPLOY_SA }}
      - name: Export dev web config
        run: ./.github/scripts/export-firebase-web-config.sh "$DEV_PROJECT_ID" "$DEV_WEB_APP_ID" firebase-web.env
      - uses: actions/upload-artifact@v4
        with:
          name: firebase-web-env
          path: firebase-web.env
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # Builds in parallel with the checks; deploy downloads the artifact instead of rebuilding.
  build:
    needs: web-config
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: firebase-web-env
      - name: Build project
        run: |
          set -a; . ./firebase-web.env; set +a
          rm -f firebase-web.env
          pnpm run build:all
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist
            functions/lib
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: [lint, type-check, test, test-counts, rules, build]
    runs-on: ubuntu-24.04
    # Never cancel a running deploy: a half-finished functions deploy leaves dev inconsistent.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v4
        with:
          name: build-output

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.DEV_WIF_PROVIDER }}
          service_account: ${{ env.DEV_DEPLOY_SA }}

      # Wrapped in a retry helper: `firebase deploy` occasionally hits a
      # transient Google API blip (e.g. an HTTP 503 on the Firestore
      # field/index reconciliation read) that fails the whole deploy even
      # though the code is fine. The script retries those transient
      # signatures with exponential backoff and fails fast on real errors.
      - name: Deploy Firebase Rules, Indexes, Functions, Storage
        run: ./.github/scripts/firebase-deploy-with-retry.sh "$DEV_PROJECT_ID"

      # `firebase deploy --only firestore` returns once index creation is
      # queued, not when the build is ready. Wait here so the new client
      # bundle can't run a query before its index is built — matches the
      # production workflow's safety order.
      - name: Wait for Firestore composite indexes to be READY
        run: ./.github/scripts/wait-for-firestore-indexes.sh "$DEV_PROJECT_ID"

      - name: Deploy Hosting
        run: pnpm exec firebase deploy --only hosting --project "$DEV_PROJECT_ID" --force

      - name: Comment deployment URL
        run: |
          echo "### 🚀 Deployed to spartboard-dev" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://spartboard-dev.web.app" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${GITHUB_REF#refs/heads/}" >> $GITHUB_STEP_SUMMARY
