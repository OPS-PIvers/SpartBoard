name: Deploy Dev Branches to spartboard-dev

on:
  push:
    branches:
      - 'dev-*'
  workflow_dispatch:
    inputs:
      full_backend:
        description: Deploy every backend target (functions, rules, indexes, storage), not just changed ones
        type: boolean
        default: false

# Hosting goes to the branch owner's own site once type-check and build pass; the shared backend
# deploys only changed targets, after every check, and only from a branch containing dev-paul
# (.github/scripts/plan-deploy.sh). Concurrency is per job: a newer push cancels superseded
# checks, but a deploy that has started always finishes.
# plan's mode (.github/scripts/check-mode.mjs): full runs every check; reuse skips the checks PR
# Validation already passed on this exact tree; docs skips app lint, type-check, rules tests and build, and deploys nothing.
# A deploy job whose commit a newer push to the branch already contains cancels its run, so an older run never lands last.

# Build and deploy add id-token: write for keyless Workload Identity Federation into spartboard-dev.
permissions:
  contents: read

env:
  VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
  VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
  VITE_OPENWEATHER_API_KEY: ${{ secrets.VITE_OPENWEATHER_API_KEY }}
  VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
  VITE_PEXELS_API_KEY: ${{ secrets.VITE_PEXELS_API_KEY }}
  VITE_SPOTIFY_CLIENT_ID: ${{ secrets.VITE_SPOTIFY_CLIENT_ID }}
  VITE_SPART_EXTENSION_ID: ${{ vars.SPART_EXTENSION_ID_DEV }}
  DEV_PROJECT_ID: spartboard-dev
  DEV_WEB_APP_ID: '1:258543092004:web:63b9aa080a08cd83c973b1'
  DEV_WIF_PROVIDER: projects/258543092004/locations/global/workloadIdentityPools/github/providers/spartboard-repo
  DEV_DEPLOY_SA: github-deploy@spartboard-dev.iam.gserviceaccount.com

jobs:
  # The app ESLint pass (type-aware, ~8 min unsplit) runs as 3 size-balanced shards; the functions
  # ESLint pass and Prettier share a fourth runner.
  lint:
    needs: plan
    if: needs.plan.outputs.mode != 'reuse'
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-lint-${{ matrix.check }}${{ matrix.shard }}
      cancel-in-progress: true
    name: lint (${{ matrix.check }}${{ matrix.shard && format(' {0}/3', matrix.shard) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { check: app, shard: 1 }
          - { check: app, shard: 2 }
          - { check: app, shard: 3 }
          - { check: format + functions }
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      # Type-aware ESLint holds a ~4.5GB TS program; 5120MB leaves headroom.
      # No --concurrency: ESLint's worker threads don't inherit NODE_OPTIONS
      # (each gets Node's own default heap ceiling), so a worker touching this
      # program would hit an unraised limit and get OOM-killed — see
      # tests/ci.eslintConcurrencyMemory.test.ts.
      - if: matrix.check == 'app' && needs.plan.outputs.mode == 'full'
        run: NODE_OPTIONS=--max-old-space-size=5120 pnpm run lint:app --shard=${{ matrix.shard }}/3
      - if: matrix.check != 'app'
        run: pnpm run format:check
      - if: matrix.check != 'app' && !cancelled()
        run: pnpm run lint:functions
      - if: matrix.check != 'app' && !cancelled()
        run: pnpm run lint:extension

  type-check:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-type-check
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: pnpm run type-check:all

  # The root suite is ~840 jsdom files; sharding across runners cuts wall time
  # roughly by the shard count. Each shard uploads its JSON report so the
  # test-counts job can merge them and apply the silent-omission guard.
  test:
    needs: plan
    if: needs.plan.outputs.mode != 'reuse'
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-test-${{ matrix.shard }}
      cancel-in-progress: true
    name: test (shard ${{ matrix.shard }}/6)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: pnpm run test:shard --shard=${{ matrix.shard }}/6 --outputFile=.vitest-reports/root-shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-report-shard-${{ matrix.shard }}
          path: .vitest-reports/root-shard-${{ matrix.shard }}.json
          retention-days: 1

  # Runs beside the root shards so the count guard below doesn't wait on it.
  functions-test:
    needs: plan
    if: needs.plan.outputs.mode != 'reuse'
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-functions-test
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: pnpm -C functions test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-report-functions
          path: .vitest-reports/functions.json
          retention-days: 1

  # The merged-shard count guard (root, functions and, unless docs mode skipped them, rules) from scripts/checkTestCounts.mjs.
  test-counts:
    needs: [plan, test, functions-test, rules]
    if: ${{ !cancelled() && needs.plan.outputs.mode != 'reuse' && needs.test.result == 'success' && needs.functions-test.result == 'success' && (needs.rules.result == 'success' || needs.plan.outputs.mode == 'docs') }}
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-test-counts
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          pattern: vitest-report-shard-*
          path: .vitest-reports/shards
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: vitest-rules-report-shard-*
          path: .vitest-reports/rules-shards
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: vitest-report-functions
          path: .vitest-reports
      - run: pnpm run test:merge-reports .vitest-reports/root.json .vitest-reports/shards/root-shard-*.json
      - if: needs.plan.outputs.mode == 'full'
        run: pnpm run test:merge-reports .vitest-reports/rules.json .vitest-reports/rules-shards/rules-shard-*.json
      - run: pnpm run test:counts

  # test:all doesn't include test:rules; without this a firestore.rules regression could reach a preview deploy unverified.
  # In reuse mode the minified copy is still tested whenever rules changed; PR Validation tested the source.
  rules:
    needs: plan
    if: needs.plan.outputs.mode == 'full' || (needs.plan.outputs.mode == 'reuse' && needs.plan.outputs.release_rules == 'true')
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-rules-${{ matrix.shard }}
      cancel-in-progress: true
    name: rules (shard ${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      # The Firestore emulator is a Java process, so we need a JDK.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Firestore emulator jar
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: firebase-emulators-${{ runner.os }}-
      # Deploys test the minified text that ships; PR validation tests the source.
      - name: Minify firestore.rules as released
        if: vars.RULES_MINIFY != '0'
        run: pnpm exec firebase setup:emulators:firestore && node scripts/minifyRules.mjs firestore.rules --write
      - name: Run Firestore rules tests
        run: RULES_SHARD=${{ matrix.shard }}/4 pnpm run test:rules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-rules-report-shard-${{ matrix.shard }}
          path: .vitest-reports/rules-shard-${{ matrix.shard }}.json
          retention-days: 1

  # Dev's public web config (repo VITE_FIREBASE_* secrets are prod's), fetched apart from build so no build code sees the deploy credential.
  web-config:
    needs: plan
    if: needs.plan.outputs.mode != 'docs'
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-web-config
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.DEV_WIF_PROVIDER }}
          service_account: ${{ env.DEV_DEPLOY_SA }}
      - name: Export dev web config
        run: ./.github/scripts/export-firebase-web-config.sh "$DEV_PROJECT_ID" "$DEV_WEB_APP_ID" firebase-web.env
      - uses: actions/upload-artifact@v4
        with:
          name: firebase-web-env
          path: firebase-web.env
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # Builds in parallel with the checks; deploy downloads the artifact instead of rebuilding.
  build:
    needs: [plan, web-config]
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: firebase-web-env
      - name: Build project
        run: |
          set -a; . ./firebase-web.env; set +a
          rm -f firebase-web.env
          pnpm run build:all
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist
            functions/lib
          retention-days: 1
          if-no-files-found: error

  # What this push deploys: the hosting site for this branch and which backend targets changed.
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      site_suffix: ${{ steps.plan.outputs.site_suffix }}
      backend: ${{ steps.plan.outputs.backend }}
      deploy_only: ${{ steps.plan.outputs.deploy_only }}
      release_rules: ${{ steps.plan.outputs.release_rules }}
      indexes: ${{ steps.plan.outputs.indexes }}
      base_sha: ${{ steps.base.outputs.sha }}
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Last commit this workflow deployed successfully on this branch; empty deploys every target.
      - id: base
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: firebase-dev-deploy.yml
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW/runs?branch=$GITHUB_REF_NAME&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')
          echo "Last successful deploy: ${sha:-none}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      # Rules, indexes and Storage are shared by every dev branch; if another branch deployed last, dev-paul redeploys them.
      - id: last
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: firebase-dev-deploy.yml
        run: |
          # Another branch's run still in flight counts too, since its backend deploy may land after this plan.
          other=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW/runs?per_page=30" --jq '
            [.workflow_runs[] | select(.conclusion == "success" or .status == "in_progress" or .status == "queued")] as $r
            | ([$r[] | select(.head_branch == "dev-paul" and .conclusion == "success") | .updated_at] | max // "") as $mine
            | [$r[] | select(.head_branch != "dev-paul" and .updated_at > $mine)] | length') || other=0
          echo "Other-branch deploys since the last dev-paul deploy: ${other:-0}"
          if [[ "$GITHUB_REF_NAME" == "dev-paul" && "${other:-0}" -gt 0 ]]; then
            echo "other_deployed_last=true" >> "$GITHUB_OUTPUT"
          fi
      - id: plan
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          OTHER_BRANCH_DEPLOYED_LAST: ${{ steps.last.outputs.other_deployed_last }}
          FULL: ${{ inputs.full_backend || false }}
        run: ./.github/scripts/plan-deploy.sh "$GITHUB_REF_NAME" "$BASE_SHA" "$FULL"
      - id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          FULL: ${{ inputs.full_backend || false }}
          BACKEND: ${{ steps.plan.outputs.backend }}
        run: |
          mode=$(node .github/scripts/check-mode.mjs "$BASE_SHA" "$FULL" "$BACKEND")
          [[ "$mode" =~ ^(full|reuse|docs)$ ]] || mode=full
          echo "Check mode: $mode" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  # Fast lane: the preview updates as soon as the bundle builds and type-checks. Lint, tests and
  # rules tests still gate the PR and the backend deploy.
  deploy-hosting:
    needs: [plan, type-check, build]
    if: ${{ !cancelled() && needs.plan.outputs.site_suffix != '' && needs.build.result == 'success' && (needs.type-check.result == 'success' || needs.plan.outputs.mode == 'reuse') }}
    runs-on: ubuntu-24.04
    concurrency:
      group: dev-hosting-${{ needs.plan.outputs.site_suffix }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
      id-token: write
    env:
      SITE: spartboard-${{ needs.plan.outputs.site_suffix }}
    steps:
      - name: Stop if a newer push superseded this one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$GITHUB_REF_NAME" --jq .status) || status=unknown
          if [[ "$status" == ahead ]]; then
            echo "::notice::$GITHUB_REF_NAME has moved past this commit; the newer run deploys it."
            gh run cancel "$GITHUB_RUN_ID"
            sleep 120
            exit 1
          fi
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v4
        with:
          name: build-output

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.DEV_WIF_PROVIDER }}
          service_account: ${{ env.DEV_DEPLOY_SA }}

      # Open tabs on an older build still lazy-load their own chunks instead of reloading mid-lesson.
      - name: Carry recent builds' assets forward
        # Dev deploys dozens of times a day, so it keeps fewer builds than prod to cut Hosting egress.
        run: node scripts/carryForwardAssets.mjs "https://${SITE}.web.app" dist 10

      - name: Deploy Hosting
        run: |
          jq --arg site "$SITE" '.hosting.site = $site' firebase.json > firebase.json.tmp
          mv firebase.json.tmp firebase.json
          pnpm exec firebase deploy --only hosting --project "$DEV_PROJECT_ID" --force

      - name: Comment deployment URL
        run: |
          echo "### 🚀 Preview deployed" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://${SITE}.web.app" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${GITHUB_REF#refs/heads/}" >> $GITHUB_STEP_SUMMARY

  # Shared backend: only changed targets, after every check. One group for the whole project so two
  # branches never deploy functions at the same time.
  deploy:
    needs: [plan, lint, type-check, test, functions-test, test-counts, rules, build]
    # Every check this mode runs must pass; reuse skips only what PR Validation passed on this exact tree.
    if: >-
      ${{ !cancelled() && needs.plan.outputs.backend == 'true' && needs.build.result == 'success'
      && (needs.rules.result == 'success' || (needs.plan.outputs.mode == 'reuse' && needs.plan.outputs.release_rules != 'true'))
      && (needs.plan.outputs.mode == 'reuse' || (needs.lint.result == 'success' && needs.type-check.result == 'success' && needs.test-counts.result == 'success')) }}
    runs-on: ubuntu-24.04
    # Never cancel a running deploy: a half-finished functions deploy leaves dev inconsistent.
    concurrency:
      group: dev-backend-spartboard-dev
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
      id-token: write
    steps:
      - name: Stop if a newer push superseded this one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$GITHUB_REF_NAME" --jq .status) || status=unknown
          if [[ "$status" == ahead ]]; then
            echo "::notice::$GITHUB_REF_NAME has moved past this commit; the newer run deploys it."
            gh run cancel "$GITHUB_RUN_ID"
            sleep 120
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      # dev-paul may have moved while the checks ran; functions deploy with --force would delete its new ones.
      - name: Confirm this branch still contains dev-paul
        if: github.ref_name != 'dev-paul'
        run: |
          git fetch --quiet origin dev-paul
          git merge-base --is-ancestor origin/dev-paul HEAD || {
            echo "::error::dev-paul moved during this run. Bring origin/dev-paul into this branch and push again to deploy the backend."
            exit 1
          }

      - uses: actions/download-artifact@v4
        with:
          name: build-output

      # plan names affected exports; keep only real Cloud Functions, since --only fails on any other name.
      - name: Name only Cloud Functions
        id: targets
        env:
          DEPLOY_ONLY: ${{ needs.plan.outputs.deploy_only }}
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          GH_TOKEN: ${{ github.token }}
          # Loading the functions needs what the CLI sets during discovery (storage triggers read the bucket).
          FIREBASE_CONFIG: '{"projectId":"spartboard-dev","storageBucket":"spartboard-dev.firebasestorage.app"}'
          GCLOUD_PROJECT: spartboard-dev
        run: |
          # A named deploy is only safe on top of dev-paul's own last deploy of the shared backend.
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/firebase-dev-deploy.yml/runs?status=success&per_page=20"             --jq '[.workflow_runs[]] | max_by(.updated_at) | "\(.head_branch) \(.head_sha)"') || last=""
          read -r last_branch last_sha <<<"$last"
          # A later dev-paul deploy between the plan's base and this commit is covered when every file it changed is also planned here.
          # A file it changed that this commit set back (a revert) is not, so that case deploys every function.
          covered() {
            [[ "$GITHUB_REF_NAME" == dev-paul && "$last_branch" == dev-paul && -n "$BASE_SHA" ]] || return 1
            git merge-base --is-ancestor "$BASE_SHA" "$last_sha" && git merge-base --is-ancestor "$last_sha" HEAD || return 1
            local theirs ours
            theirs=$(git diff --name-only "$BASE_SHA" "$last_sha") && ours=$(git diff --name-only "$BASE_SHA" HEAD) || return 1
            [[ -z "$(comm -23 <(sort <<<"$theirs") <(sort <<<"$ours"))" ]]
          }
          if [[ "$last" != "dev-paul $BASE_SHA" ]] && ! covered; then
            export DEPLOY_ALL_FUNCTIONS=true
          fi
          targets="$(node .github/scripts/function-targets.mjs "$DEPLOY_ONLY")"
          echo "deploy_only=$targets" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.DEV_WIF_PROVIDER }}
          service_account: ${{ env.DEV_DEPLOY_SA }}

      # Every functions deploy rebuilds all ~195 images; without this policy they pile up in Artifact Registry.
      - name: Keep only a day of function images
        if: contains(needs.plan.outputs.deploy_only, 'functions')
        run: |
          pnpm exec firebase functions:artifacts:setpolicy --days 1 --force --project "$DEV_PROJECT_ID" ||
            echo "::warning::Could not set the Artifact Registry cleanup policy on spartboard-dev; old function images will keep piling up."

      # releaseFirestoreRules.mjs proves the minified rules with the compiler in the emulator jar.
      - name: Setup Java
        if: needs.plan.outputs.release_rules == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Firestore emulator jar
        if: needs.plan.outputs.release_rules == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: firebase-emulators-${{ runner.os }}-
      - name: Download Firestore emulator jar
        if: needs.plan.outputs.release_rules == 'true'
        run: pnpm exec firebase setup:emulators:firestore

      # Wrapped in a retry helper: `firebase deploy` occasionally hits a transient Google API blip
      # that fails the whole deploy even though the code is fine.
      - name: Deploy Firebase Rules, Indexes, Functions, Storage
        env:
          FIREBASE_DEPLOY_ONLY: ${{ steps.targets.outputs.deploy_only }}
          RELEASE_FIRESTORE_RULES: ${{ needs.plan.outputs.release_rules }}
          # Incident escape hatch: repo variable RULES_MINIFY=0 releases the unminified rules.
          RULES_MINIFY: ${{ vars.RULES_MINIFY }}
        run: ./.github/scripts/firebase-deploy-with-retry.sh "$DEV_PROJECT_ID"

      - name: Upload rules name map
        if: always() && needs.plan.outputs.release_rules == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rules-name-map
          path: rules-name-map.txt
          if-no-files-found: ignore
          retention-days: 90

      # `firebase deploy` returns once index creation is queued, not when the build is ready.
      - name: Wait for Firestore composite indexes to be READY
        if: needs.plan.outputs.indexes == 'true'
        run: ./.github/scripts/wait-for-firestore-indexes.sh "$DEV_PROJECT_ID"

      - name: Summarize backend deploy
        env:
          DEPLOY_ONLY: ${{ steps.targets.outputs.deploy_only }}
          RULES: ${{ needs.plan.outputs.release_rules }}
        run: |
          echo "### Backend deployed to spartboard-dev" >> $GITHUB_STEP_SUMMARY
          echo "**Targets:** ${DEPLOY_ONLY:-none}; rules released: ${RULES}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${GITHUB_REF#refs/heads/}" >> $GITHUB_STEP_SUMMARY
