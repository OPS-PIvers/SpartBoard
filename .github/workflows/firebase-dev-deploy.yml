name: Deploy Dev Branches to Firebase Preview

on:
  push:
    branches:
      - 'dev-*'
  workflow_dispatch:

# Cancel a superseded preview deploy when a newer commit is pushed to the same
# branch, so rapid successive pushes don't each run the full suite to
# completion. (workflow_dispatch is kept so a preview can also be re-run manually
# from the Actions tab.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Deploys authenticate with the service-account secret, so GITHUB_TOKEN only needs to read the repo.
permissions:
  contents: read

env:
  VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
  VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
  VITE_OPENWEATHER_API_KEY: ${{ secrets.VITE_OPENWEATHER_API_KEY }}
  VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
  VITE_PEXELS_API_KEY: ${{ secrets.VITE_PEXELS_API_KEY }}
  VITE_SPOTIFY_CLIENT_ID: ${{ secrets.VITE_SPOTIFY_CLIENT_ID }}

jobs:
  # The app ESLint pass (type-aware, ~3.5 min), the functions ESLint pass and
  # Prettier each get their own runner instead of running back to back.
  lint:
    runs-on: ubuntu-24.04
    name: lint (${{ matrix.check }})
    strategy:
      fail-fast: false
      matrix:
        check: [app, functions, format]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      # Type-aware ESLint on the root app holds a ~4.5GB TS program; 5120MB leaves headroom.
      - if: matrix.check == 'app'
        run: NODE_OPTIONS=--max-old-space-size=5120 pnpm run lint:app
      - if: matrix.check == 'functions'
        run: pnpm run lint:functions
      - if: matrix.check == 'format'
        run: pnpm run format:check

  type-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: pnpm run type-check:all

  # The root suite is ~840 jsdom files; sharding across runners cuts wall time
  # roughly by the shard count. Each shard uploads its JSON report so the
  # test-counts job can merge them and apply the silent-omission guard.
  test:
    runs-on: ubuntu-24.04
    name: test (shard ${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: pnpm run test:shard --shard=${{ matrix.shard }}/3 --outputFile=.vitest-reports/root-shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-report-shard-${{ matrix.shard }}
          path: .vitest-reports/root-shard-${{ matrix.shard }}.json
          retention-days: 1

  # Functions suite (~5s) plus the merged-shard count guard from scripts/checkTestCounts.mjs.
  test-counts:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          pattern: vitest-report-shard-*
          path: .vitest-reports/shards
          merge-multiple: true
      - run: pnpm run test:merge-reports .vitest-reports/root.json .vitest-reports/shards/root-shard-*.json
      - run: pnpm -C functions test
      - run: pnpm run test:counts

  # test:all doesn't include test:rules; without this a firestore.rules regression could reach a preview deploy unverified.
  rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      # The Firestore emulator is a Java process, so we need a JDK.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Firestore emulator jar
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: firebase-emulators-${{ runner.os }}-
      - name: Run Firestore rules tests
        run: pnpm run test:rules

  # Builds in parallel with the checks; deploy downloads the artifact instead of rebuilding.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Build project
        run: pnpm run build:all
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist
            functions/lib
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: [lint, type-check, test, test-counts, rules, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Extract branch name
        id: extract_branch
        run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Create Service Account File
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > service-account.json

      # Wrapped in a retry helper: `firebase deploy` occasionally hits a
      # transient Google API blip (e.g. an HTTP 503 on the Firestore
      # field/index reconciliation read) that fails the whole deploy even
      # though the code is fine. The script retries those transient
      # signatures with exponential backoff and fails fast on real errors.
      - name: Deploy Firebase Rules, Indexes, Functions, Storage
        run: ./.github/scripts/firebase-deploy-with-retry.sh spartboard
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ./service-account.json

      # `firebase deploy --only firestore` returns once index creation is
      # queued, not when the build is ready. Wait here so the preview
      # channel's client bundle can't run a query before its index is
      # built — matches the production workflow's safety order.
      - name: Wait for Firestore composite indexes to be READY
        run: ./.github/scripts/wait-for-firestore-indexes.sh spartboard
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ./service-account.json

      - name: Deploy to Firebase Preview Channel
        id: deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service-account.json
        run: |
          # --json removed: firebase-tools 15.22.3 fails hosting:channel:deploy
          # under --json in CI (the human-readable deploy succeeds). `tee` keeps
          # the deploy output in the log, and the GH default shell's pipefail
          # still fails this step if the deploy errors. The Channel URL is parsed
          # from the normal output for the summary comment.
          pnpm exec firebase hosting:channel:deploy ${{ steps.extract_branch.outputs.branch }} --expires 30d --project spartboard 2>&1 | tee channel-deploy.log
          URL=$(grep -i 'Channel URL' channel-deploy.log | grep -oE 'https://[^ ]+\.web\.app' | head -n 1)
          echo "details_url=$URL" >> $GITHUB_OUTPUT
          rm -f channel-deploy.log

      - name: Cleanup Service Account File
        if: always()
        run: rm -f service-account.json

      - name: Comment deployment URL
        run: |
          echo "### 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "**Preview URL:** ${{ steps.deploy.outputs.details_url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ steps.extract_branch.outputs.branch }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This preview will be available for 30 days and updates with each push to this branch." >> $GITHUB_STEP_SUMMARY
