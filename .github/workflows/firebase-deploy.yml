name: Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never run two production deploys at once; a newer main commit waits for the
# in-flight one to finish rather than cancelling it mid-release.
concurrency:
  group: ${{ github.workflow }}-production
  cancel-in-progress: false

# Deploys authenticate with the service-account secret, so GITHUB_TOKEN only needs to read the repo.
permissions:
  contents: read

env:
  VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
  VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
  VITE_OPENWEATHER_API_KEY: ${{ secrets.VITE_OPENWEATHER_API_KEY }}
  VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
  VITE_PEXELS_API_KEY: ${{ secrets.VITE_PEXELS_API_KEY }}
  VITE_SPOTIFY_CLIENT_ID: ${{ secrets.VITE_SPOTIFY_CLIENT_ID }}

jobs:
  # Same parallel layout as the dev-branch workflow: every check runs on its
  # own runner and deploy waits for all of them.
  lint:
    runs-on: ubuntu-24.04
    name: lint (${{ matrix.check }})
    strategy:
      fail-fast: false
      matrix:
        check: [app, functions, format]
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: ./.github/actions/setup
      # Type-aware ESLint holds a ~4.5GB TS program; 5120MB leaves headroom.
      # No --concurrency: ESLint's worker threads don't inherit NODE_OPTIONS
      # (each gets Node's own default heap ceiling), so a worker touching this
      # program would hit an unraised limit and get OOM-killed — see
      # tests/ci.eslintConcurrencyMemory.test.ts.
      - if: matrix.check == 'app'
        run: NODE_OPTIONS=--max-old-space-size=5120 pnpm run lint:app
      - if: matrix.check == 'functions'
        run: pnpm run lint:functions
      - if: matrix.check == 'format'
        run: pnpm run format:check

  type-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: ./.github/actions/setup
      - run: pnpm run type-check:all

  test:
    runs-on: ubuntu-24.04
    name: test (shard ${{ matrix.shard }}/3)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: ./.github/actions/setup
      - run: pnpm run test:shard --shard=${{ matrix.shard }}/3 --outputFile=.vitest-reports/root-shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-report-shard-${{ matrix.shard }}
          path: .vitest-reports/root-shard-${{ matrix.shard }}.json
          retention-days: 1

  # Functions suite (~5s) plus the merged-shard count guard from scripts/checkTestCounts.mjs.
  test-counts:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          pattern: vitest-report-shard-*
          path: .vitest-reports/shards
          merge-multiple: true
      - run: pnpm run test:merge-reports .vitest-reports/root.json .vitest-reports/shards/root-shard-*.json
      - run: pnpm -C functions test
      - run: pnpm run test:counts

  # test:all doesn't include test:rules; without this a firestore.rules regression could reach prod unverified.
  rules:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: ./.github/actions/setup
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Firestore emulator jar
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: firebase-emulators-${{ runner.os }}-
      - name: Run Firestore rules tests
        run: pnpm run test:rules

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: ./.github/actions/setup
      - name: Build project
        run: pnpm run build:all
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist
            functions/lib
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: [lint, type-check, test, test-counts, rules, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v4
        with:
          name: build-output

      # Deploy backend (rules, indexes, functions, storage) BEFORE hosting.
      # Reason: a new Firestore composite index isn't usable until it
      # finishes building, but `firebase deploy --only firestore` returns
      # success as soon as the build is queued. If hosting went first, a
      # query in the new client bundle that needs a not-yet-built index
      # would fail with FAILED_PRECONDITION the moment a teacher hit the
      # code path. Order: backend first, wait for indexes, hosting last.
      - name: Create Service Account File
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > service-account.json

      # Wrapped in a retry helper: `firebase deploy` occasionally hits a
      # transient Google API blip (e.g. an HTTP 503 on the Firestore
      # field/index reconciliation read) that fails the whole deploy even
      # though the code is fine. The script retries those transient
      # signatures with exponential backoff and fails fast on real errors.
      - name: Deploy Firebase Rules, Indexes, Functions, Storage
        run: ./.github/scripts/firebase-deploy-with-retry.sh spartboard
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ./service-account.json

      - name: Wait for Firestore composite indexes to be READY
        run: ./.github/scripts/wait-for-firestore-indexes.sh spartboard
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ./service-account.json

      - name: Deploy to Firebase Hosting (Live)
        # CLI deploy via the repo's firebase-tools (15.22.3) instead of
        # FirebaseExtended/action-hosting-deploy@v0.10.0, whose OWN bundled
        # (older) firebase-tools hits "premature close" on googleapis
        # token/cloudfunctions calls under the current GitHub runner image —
        # the same root cause that broke the 15.8.0 backend deploy. dist was
        # built in the parallel build job (firebase.json has no predeploy
        # hook), so this just releases it to the live channel.
        # Idempotent: when the built bundle is byte-identical to the current
        # live version, firebase rejects the re-release with 400 "is the current
        # active version". That's a no-op success (backend/workflow/docs-only
        # deploys don't change dist), so treat it as such; any other error still
        # fails the deploy.
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service-account.json
        run: |
          set +e
          OUT=$(pnpm exec firebase deploy --only hosting --project spartboard 2>&1)
          CODE=$?
          echo "$OUT"
          if [ "$CODE" -ne 0 ]; then
            if echo "$OUT" | grep -q "is the current active version"; then
              echo "::notice::Hosting bundle unchanged — already live; nothing to release."
              exit 0
            fi
            exit "$CODE"
          fi

      - name: Cleanup Service Account File
        if: always()
        run: rm -f service-account.json

      - name: Deployment Summary
        if: success()
        run: |
          echo "### 🚀 Production Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL**: https://spartboard.web.app" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
