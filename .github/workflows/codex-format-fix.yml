name: Codex format fix

on:
  push:
    branches:
      - codex/migrate-wave10-widget-drawers

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/migrate-wave10-widget-drawers
          token: \${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v5
        with:
          version: 10.30.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          components/widgets/MaterialsWidget/settingsFields.test.tsx
          components/widgets/Schedule/settingsFields.test.tsx
          components/widgets/PdfWidget/settingsFields.test.tsx
          components/widgets/RecessGear/settingsFields.test.tsx
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/widgets/MaterialsWidget/settingsFields.test.tsx
          git add components/widgets/Schedule/settingsFields.test.tsx
          git add components/widgets/PdfWidget/settingsFields.test.tsx
          git add components/widgets/RecessGear/settingsFields.test.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(settings): format drawer coverage tests"
          git push origin HEAD:codex/migrate-wave10-widget-drawers
