  const BUILTIN = {
    quiz: [
      { id: 'test', label: 'Test', icon: 'graduation-cap', rules: { ...DEFAULT_RULES, focus: true, tabAuto: true, blockCopy: true, shuffleQ: true, shuffleA: true } },
      { id: 'practice', label: 'Practice', icon: 'pen-line', rules: { ...DEFAULT_RULES, attempts: 0, showScore: true, showRW: true, reveal: true } },
      { id: 'exit', label: 'Exit ticket', icon: 'timer', rules: { ...DEFAULT_RULES, timeOn: true, minutes: 5, shuffleA: true, showScore: true } },
      { id: 'study', label: 'Study resource', icon: 'book-open', when: 'study' },
    ],
    va: [
      { id: 'work', label: 'For credit', icon: 'graduation-cap', when: 'scheduled', pacing: 'student' },
      { id: 'live', label: 'Live lesson', icon: 'play', when: 'manual', pacing: 'teacher' },
      { id: 'study', label: 'Study resource', icon: 'book-open', when: 'study' },
    ],
    gl: [
      { id: 'work', label: 'For credit', icon: 'graduation-cap', when: 'scheduled' },
      { id: 'study', label: 'Study resource', icon: 'book-open', when: 'study' },
    ],
    flash: [
      { id: 'check', label: 'Check', icon: 'list-checks', when: 'scheduled', flash: { ...DEFAULT_FLASH, collect: true, mode: 'check' } },
      { id: 'study', label: 'Study', icon: 'book-open', when: 'study', flash: { ...DEFAULT_FLASH, collect: false, mode: 'study' } },
    ],
  };
  const ACT = {
    quiz: { label: 'Quiz', short: 'Quiz', title: 'Sample Quiz', name: true, rules: true, plc: true },
    va: { label: 'Video Activity', short: 'Video', title: 'Cell Division Video', name: true, rules: false, plc: true, pacing: true },
    gl: { label: 'Guided Learning', short: 'Guided Learning', title: 'Parts of a Cell', name: false, rules: false, plc: false },
    flash: { label: 'Flashcards', short: 'Flashcards', title: 'Unit 3 Vocabulary', name: false, rules: true, plc: false },
  };
  const PROTOS = [
    { id: 1, label: 'Stepped flow', short: '1 Stepped' },
    { id: 2, label: 'Class grid', short: '2 Class grid' },
    { id: 3, label: 'Purpose first', short: '3 Purpose first' },
    { id: 4, label: 'One page', short: '4 One page' },
  ];
  const ROSTER = [
    { id: 's03', name: 'Avery T.' }, { id: 's08', name: 'Jordan M.' },
    { id: 's14', name: 'Priya K.' }, { id: 's19', name: 'Mateo R.' },
  ];
  const LANGS = { en: 'English', es: 'Español', ru: 'Русский', so: 'Soomaali' };

  const freshWin = () => ({ o: { day: TODAY, time: 'bell' }, c: { day: TODAY, time: 'bell' } });
  const clone = (o) => JSON.parse(JSON.stringify(o));

  const S = {
    proto: 1, activity: 'quiz', mem: 'A', open: true, step: 1, view: 'main', toast: '',
    classes: [
      { id: 'c1', name: 'Sample - Mock Period 1 (TEST)', n: 28, on: true },
      { id: 'c2', name: 'Sample 2', n: 24, on: true },
      { id: 'c3', name: 'Sample 3', n: 26, on: true },
    ],
    when: 'scheduled', each: false, allowAfter: false,
    win: { all: freshWin(), c1: freshWin(), c2: freshWin(), c3: freshWin() },
    due: { all: '', c1: '', c2: '', c3: '' },
    name: 'Sample Quiz', plc: { on: false, which: 'Grade 8 Science PLC' },
    rules: clone(LAST_USED), flash: clone(DEFAULT_FLASH), pacing: 'student',
    purpose: 'last', adjust: false, userPresets: [], presetId: '',
    mods: [{ id: 's25', cls: 'c1', name: 'sstudent25', readAloud: true, lang: 'ru', skip: false, open: false }],
    ruReady: false, generating: false, spy: 'who',
  };

  /* ---------- state helpers ---------- */
  const getPath = (o, p) => p.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
  const setPath = (o, p, v) => {
    const ks = p.split('.');
    const last = ks.pop();
    ks.reduce((a, k) => a[k], o)[last] = v;
  };
  const sel = () => S.classes.filter((c) => c.on);
  const act = () => ACT[S.activity];
  const winFor = (cid) => (S.each ? S.win[cid] : S.win.all);
  const spreadAll = () => S.classes.forEach((c) => { S.win[c.id] = clone(S.win.all); S.due[c.id] = S.due.all; });
  const syncWin = () => {
    if (!S.each) spreadAll();
    else {
      const differs = S.classes.some((c) => JSON.stringify(S.win[c.id]) !== JSON.stringify(S.win.all));
      if (!differs) S.each = false;
    }
  };
  const rulesDiffer = (k) => JSON.stringify(S.rules[k]) !== JSON.stringify(DEFAULT_RULES[k]);

  function resetForMem() {
    S.rules = clone(S.mem === 'A' ? LAST_USED : DEFAULT_RULES);
    if (S.activity === 'quiz') S.purpose = S.mem === 'A' ? 'last' : 'none';
    S.presetId = '';
    S.flash = clone(DEFAULT_FLASH);
  }
  function applyPurpose(id) {
    const list = BUILTIN[S.activity];
    const all = [...list, ...S.userPresetsFor()];
    S.purpose = id;
    if (id === 'last') { S.rules = clone(LAST_USED); if (S.when === 'study') S.when = 'scheduled'; return; }
    const p = all.find((x) => x.id === id);
    if (!p) return;
    if (p.rules) S.rules = clone(p.rules);
    if (p.when) S.when = p.when;
    else if (S.when === 'study' && p.id !== 'study') S.when = 'scheduled';
    if (p.pacing) S.pacing = p.pacing;
    if (p.flash) S.flash = clone(p.flash);
  }
  S.userPresetsFor = () =>
    S.activity === 'quiz' && S.mem === 'B'
      ? [...PRESETS.map((p) => ({ ...p, icon: 'bookmark', hint: 'Saved preset' })), ...S.userPresets]
      : [];

  /* ---------- text helpers ---------- */
  const fmtDay = (d) => {
    if (!d) return '';
    const [y, m, dd] = d.split('-').map(Number);
    return new Date(y, m - 1, dd).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  };
  const fmtTime = (t, side) => (t === 'bell' ? (side === 'o' ? 'start of class' : 'end of class') : t);
  const rulesSummary = (r) => {
    const p = [];
    p.push(r.attempts === 0 ? 'Unlimited attempts' : `${r.attempts} attempt${r.attempts > 1 ? 's' : ''}`);
    if (r.timeOn) p.push(`${r.minutes} min`);
    if (r.focus) p.push('Focus mode');
    if (r.blockCopy) p.push('No copy and paste');
    if (r.shuffleQ && r.shuffleA) p.push('Shuffled');
    else if (r.shuffleQ) p.push('Shuffled questions');
    else if (r.shuffleA) p.push('Shuffled answers');
    if (r.showScore) p.push('Score shown');
    return p.join(', ');
  };
  const whenSummary = () => {
    if (S.when === 'manual') return 'Manual. You start and pause each class.';
    const w = S.win.all;
    const label = S.when === 'study' ? 'Available' : 'Open';
    if (S.each) return `${label} on different dates for each class`;
    return `${label} ${fmtDay(w.o.day)}, ${fmtTime(w.o.time, 'o')} to ${fmtDay(w.c.day)}, ${fmtTime(w.c.time, 'c')}`;
  };
  const modsSummary = () => {
    if (!S.mods.length) return 'None';
    const skipped = S.mods.filter((m) => m.skip).length;
    const changed = S.mods.length - skipped;
    return [changed && `${changed} modified`, skipped && `${skipped} skipped`].filter(Boolean).join(', ');
  };

  /* ---------- small components ---------- */
  const dot = (changed) =>
    changed ? '<span title="Changed from default" class="inline-block w-1.5 h-1.5 rounded-full bg-brand-blue-primary shrink-0"></span>' : '';
  const sectionHead = (t, extra = '') =>
    `<div class="flex items-center justify-between gap-2 pt-1"><div class="text-xxs font-bold text-brand-blue-primary/60 uppercase tracking-widest">${t}</div>${extra}</div>`;
  const label = (t, changed) =>
    `<span class="flex items-center gap-1.5 min-w-0"><span class="text-sm font-bold text-brand-blue-dark">${t}</span>${dot(changed)}</span>`;
  const subLabel = (t, changed) =>
    `<span class="flex items-center gap-1.5 min-w-0"><span class="text-sm font-medium text-slate-700">${t}</span>${dot(changed)}</span>`;
  const toggle = (path, on, aria, disabled = false) =>
    `<button type="button" role="switch" aria-checked="${on}" aria-label="${aria}" ${disabled ? 'disabled' : ''} data-act="toggle" data-path="${path}" class="w-10 h-5 rounded-full relative transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-blue-primary ${on ? 'bg-brand-blue-primary' : 'bg-slate-300'} ${disabled ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer'} flex-shrink-0"><span class="absolute inset-0 flex items-center justify-between px-1.5 pointer-events-none select-none"><span class="text-xxxs font-black leading-none text-white transition-opacity duration-200 ${on ? 'opacity-100' : 'opacity-0'}">ON</span><span class="text-xxxs font-black leading-none text-slate-900 transition-opacity duration-200 ${!on ? 'opacity-100' : 'opacity-0'}">OFF</span></span><span class="absolute top-1 left-1 bg-white rounded-full shadow transition-transform duration-200 ease-in-out w-3 h-3 ${on ? 'translate-x-5' : 'translate-x-0'}"></span></button>`;
  const row = (lbl, ctrl, cls = '') => `<div class="flex items-center justify-between gap-3 min-h-[2rem] ${cls}">${lbl}${ctrl}</div>`;
  const toggleRow = (text, path, aria, { sub = false, disabled = false } = {}) => {
    const on = getPath(S, path);
    const key = path.replace('rules.', '');
    const changed = path.startsWith('rules.') && rulesDiffer(key);
    return row(sub ? subLabel(text, changed) : label(text, changed), toggle(path, on, aria || text, disabled));
  };
  const seg = (path, options, value, extra = '') =>
    `<div role="radiogroup" class="inline-flex p-1 bg-slate-100 rounded-lg ${extra}">${options
      .map(
        (o) =>
          `<button type="button" role="radio" aria-checked="${value === o.v}" data-act="set" data-path="${path}" data-val="${o.v}" data-type="${typeof o.v === 'number' ? 'number' : typeof o.v === 'boolean' ? 'bool' : 'str'}" class="h-8 px-3 rounded-md text-xs font-semibold whitespace-nowrap ${value === o.v ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'}">${o.t}</button>`
      )
      .join('')}</div>`;
  const group = (path, options, value) =>
    `<div class="inline-flex rounded-lg border border-slate-200 bg-white overflow-hidden">${options
      .map(
        (o) =>
          `<button type="button" data-act="set" data-path="${path}" data-val="${o.v}" data-type="number" aria-pressed="${value === o.v}" class="px-3 py-1.5 text-xs font-bold ${value === o.v ? 'bg-brand-blue-primary text-white' : 'text-slate-700 hover:bg-slate-50'}">${o.t}</button>`
      )
      .join('')}</div>`;
  const select = (path, options, value, cls = 'w-44') =>
    `<select data-bind="${path}" class="h-8 ${cls} px-2 bg-white border border-slate-300 rounded-lg text-sm text-slate-800 focus:outline-none focus:border-brand-blue-primary">${options
      .map((o) => `<option value="${o.v}" ${String(value) === String(o.v) ? 'selected' : ''}>${o.t}</option>`)
      .join('')}</select>`;
  const numInput = (path, value, { min = 1, max = 300, w = 'w-16' } = {}) =>
    `<input type="number" min="${min}" max="${max}" value="${value}" data-bind="${path}" data-type="number" class="${w} px-2 py-1 bg-white border border-slate-200 rounded-lg text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-blue-primary" />`;
  const textInput = (path, value, ph = '') =>
    `<input type="text" value="${value}" placeholder="${ph}" data-bind="${path}" class="w-full px-3 py-2 bg-white border border-slate-200 rounded-lg text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-brand-blue-primary" />`;
  const fieldLabel = (t) => `<label class="block text-xxs font-bold text-slate-400 uppercase tracking-widest mb-1">${t}</label>`;
  const btnText = (t, a, extra = '') =>
    `<button type="button" data-act="${a}" class="text-xs font-bold text-brand-blue-primary hover:bg-brand-blue-lighter/40 rounded-lg px-2 py-1 ${extra}">${t}</button>`;
  const caret = (open) => `<span class="inline-flex transition-transform ${open ? 'rotate-90' : ''}">${ic('chevron-right', 'w-4 h-4 text-slate-400')}</span>`;

  /* ---------- when (availability) ---------- */
  const dateTime = (base, side, { fill = false } = {}) => {
    const pt = getPath(S, base);
    const bell = side === 'o' ? 'Start of class' : 'End of class';
    const bind = (suffix) => `data-bind="${base}.${suffix}" ${fill ? 'data-fill="1"' : ''}`;
    const timeCell =
      pt.time === 'bell'
        ? `${ic('clock', 'h-3.5 w-3.5 shrink-0 text-slate-500')}<select aria-label="Time" ${bind('time')} data-type="time" data-side="${side}" class="min-w-0 flex-1 appearance-none bg-transparent pr-4 focus:outline-none"><option value="bell">${bell}</option><option value="set">Set a time</option></select><span class="pointer-events-none absolute right-2">${ic('chevron-down', 'h-3.5 w-3.5 text-slate-400')}</span>`
        : `<input type="time" aria-label="Time" value="${pt.time}" ${bind('time')} class="min-w-0 flex-1 bg-transparent focus:outline-none" /><button type="button" title="${bell}" aria-label="${bell}" data-act="bell" data-path="${base}.time" ${fill ? 'data-fill="1"' : ''} class="rounded p-0.5 text-slate-400 hover:text-slate-700">${ic('x', 'h-3.5 w-3.5')}</button>`;
    return `<div class="flex h-8 items-stretch rounded-lg border border-slate-300 bg-white text-slate-800 focus-within:border-brand-blue-primary text-sm"><span class="flex items-center border-r border-slate-200 pl-2.5 pr-1.5"><input type="date" aria-label="Date" value="${pt.day}" ${bind('day')} class="w-[8.25rem] bg-transparent focus:outline-none" /></span><span class="relative flex w-40 items-center gap-1.5 pl-2.5 pr-2">${timeCell}</span></div>`;
  };
  const labeled = (lbl, ctrl, w = 'w-14') =>
    `<div class="flex items-center gap-2"><span class="${w} shrink-0 text-sm font-semibold text-slate-700">${lbl}</span>${ctrl}</div>`;
  const dueInput = (path) =>
    `<div class="flex h-8 items-stretch rounded-lg border border-slate-300 bg-white text-sm focus-within:border-brand-blue-primary"><span class="flex items-center pl-2.5 pr-1.5"><input type="date" aria-label="Due date" value="${getPath(S, path)}" data-bind="${path}" class="w-[8.25rem] bg-transparent focus:outline-none" /></span></div>`;

  const whenMode = () =>
    seg('when', [{ v: 'scheduled', t: 'Scheduled' }, { v: 'manual', t: 'Manual' }, { v: 'study', t: 'Study resource' }], S.when, 'w-full [&>button]:flex-1');
  const eachSwitch = () =>
    sel().length > 1 && S.when !== 'manual'
      ? seg('each', [{ v: false, t: 'All classes' }, { v: true, t: 'Each class' }], S.each, '[&>button]:h-6')
      : sel().length > 1
        ? seg('each', [{ v: false, t: 'All classes' }, { v: true, t: 'Each class' }], S.each, '[&>button]:h-6')
        : '';
  // data-type for boolean segs
  const whenFields = ({ showAfter = true } = {}) => {
    const targets = S.each && sel().length > 1 ? sel().map((c) => ({ key: c.id, name: c.name })) : [{ key: 'all', name: '' }];
    const closeLbl = S.when === 'study' ? 'Available until' : 'Closes';
    const wl = S.when === 'study' ? 'w-28' : 'w-14';
    if (S.when === 'manual') {
      const dueRows = targets
        .map(
          (t) =>
            `<div class="space-y-1.5">${t.name ? `<div class="text-xs font-bold text-slate-500">${t.name}</div>` : ''}${labeled('Due', dueInput(`due.${t.key}`), 'w-14')}</div>`
        )
        .join('');
      return `<div class="space-y-3"><div class="flex items-center gap-2 text-sm text-slate-700">${ic('pause', 'w-4 h-4 text-brand-blue-primary')}<span class="font-medium">Starts paused. You start and pause each class.</span></div><div class="space-y-3">${dueRows}</div></div>`;
    }
    const blocks = targets
      .map(
        (t) =>
          `<div class="space-y-2">${t.name ? `<div class="text-xs font-bold text-slate-500">${t.name}</div>` : ''}${labeled(S.when === 'study' ? 'Opens' : 'Opens', dateTime(`win.${t.key}.o`, 'o'), wl)}${labeled(closeLbl, dateTime(`win.${t.key}.c`, 'c'), wl)}</div>`
      )
      .join('');
    const after =
      showAfter && S.when === 'scheduled'
        ? row(label('Allow submissions after close'), toggle('allowAfter', S.allowAfter, 'Allow submissions after close'), 'pt-1')
        : '';
    return `<div class="space-y-3">${blocks}${after}</div>`;
  };
  const whenBlock = (opts = {}) =>
    `<div class="space-y-3">${whenMode()}${eachSwitch() ? `<div>${eachSwitch()}</div>` : ''}${whenFields(opts)}</div>`;

  /* ---------- classes ---------- */
  const classList = () =>
    `<div><div class="rounded-xl border border-slate-200 bg-white p-3 space-y-2">${S.classes
      .map(
        (c) =>
          `<label class="flex items-center gap-2 text-sm text-slate-800 cursor-pointer"><input type="checkbox" ${c.on ? 'checked' : ''} data-act="cls" data-id="${c.id}" class="w-4 h-4 rounded accent-brand-blue-primary" /><span class="min-w-0 truncate">${c.name}</span><span class="ml-auto text-xs text-slate-400">${c.n}</span></label>`
      )
      .join('')}</div><div class="flex items-center justify-between pt-1.5"><span class="text-xs text-slate-500">${sel().length} of ${S.classes.length} selected</span><button type="button" data-act="${sel().length ? 'clsClear' : 'clsAll'}" class="text-xs font-bold text-brand-blue-primary hover:underline">${sel().length ? 'Clear' : 'Select all'}</button></div></div>`;

  /* ---------- mods ---------- */
  const modsRow = () =>
    `<button type="button" data-act="mods" class="group flex w-full items-center justify-between gap-2 rounded-xl border border-slate-200 bg-white px-3 py-2 text-left hover:border-brand-blue-primary/50">${`<span class="flex items-center gap-2 min-w-0">${ic('sliders-horizontal', 'w-4 h-4 text-brand-blue-primary')}<span class="text-sm font-bold text-brand-blue-dark">Modifications</span></span>`}<span class="flex items-center gap-2 min-w-0"><span class="text-xs text-slate-500 truncate">${modsSummary()}</span>${ic('chevron-right', 'w-4 h-4 text-slate-400')}</span></button>`;

  const modsView = () => {
    const needRu = S.mods.some((m) => m.lang === 'ru') && !S.ruReady;
    const ruName = S.mods.find((m) => m.lang === 'ru');
    const banner = needRu
      ? `<div class="flex items-center justify-between gap-3 rounded-lg border border-amber-200 bg-amber-50 px-3 py-2 text-xs text-amber-800"><span>${ruName.name} needs Русский. That translation isn't ready. They'll see English.</span><button type="button" data-act="generate" class="shrink-0 rounded-md border border-amber-300 bg-white px-2.5 py-1 font-bold text-amber-800 hover:bg-amber-100">${S.generating ? 'Generating' : 'Generate'}</button></div>`
      : '';
    const rows = S.mods
      .map((m, i) => {
        const chips = [m.readAloud && 'Read aloud', m.lang !== 'en' && LANGS[m.lang], m.skip && 'Skipped'].filter(Boolean);
        return `<div class="rounded-xl border border-slate-200 bg-white"><button type="button" data-act="modOpen" data-i="${i}" class="flex w-full items-center justify-between gap-3 px-3 py-2.5 text-left"><span class="min-w-0"><span class="block text-sm font-bold text-slate-800">${m.name}</span><span class="mt-1 flex flex-wrap gap-1.5">${chips.map((c) => `<span class="rounded-md bg-slate-100 px-2 py-0.5 text-xs font-semibold text-slate-700">${c}</span>`).join('') || '<span class="text-xs text-slate-400">No changes</span>'}</span></span>${ic(m.open ? 'chevron-down' : 'chevron-right', 'w-4 h-4 text-slate-400 shrink-0')}</button>${
          m.open
            ? `<div class="space-y-2 border-t border-slate-100 px-3 py-3">${row(subLabel('Read aloud'), toggle(`mods.${i}.readAloud`, m.readAloud, 'Read aloud'))}${row(subLabel('Language'), select(`mods.${i}.lang`, Object.entries(LANGS).map(([v, t]) => ({ v, t })), m.lang, 'w-36'))}${row(subLabel('Skip this student'), toggle(`mods.${i}.skip`, m.skip, 'Skip this student'))}${`<div class="pt-1"><button type="button" data-act="modRemove" data-i="${i}" class="text-xs font-bold text-brand-red-primary hover:underline">Remove modification</button></div>`}</div>`
            : ''
        }</div>`;
      })
      .join('');
    const addable = ROSTER.filter((r) => !S.mods.some((m) => m.id === r.id));
    return `<div class="space-y-4 px-6 py-5">${banner}<p class="text-sm text-slate-600">40 students have no school sign-in and can't be changed individually.</p>${sectionHead('Standing')}<div class="space-y-2">${rows}</div><div class="flex items-center gap-2">${select('addMod', [{ v: '', t: 'Add a student' }, ...addable.map((r) => ({ v: r.id, t: r.name }))], '', 'w-48')}</div></div>`;
  };

  /* ---------- plc / name ---------- */
  const plcRow = () =>
    `<div class="space-y-2">${row(`<span class="flex items-center gap-2 min-w-0">${ic('share-2', 'w-4 h-4 text-brand-blue-primary')}<span class="text-sm font-bold text-brand-blue-dark">Share results with a PLC</span></span>`, toggle('plc.on', S.plc.on, 'Share results with a PLC'))}${
      S.plc.on ? `<div class="pl-6">${select('plc.which', [{ v: 'Grade 8 Science PLC', t: 'Grade 8 Science PLC' }, { v: 'Orono MS Science', t: 'Orono MS Science' }], S.plc.which, 'w-56')}</div>` : ''
    }</div>`;
  const nameField = () => (act().name ? `<div>${fieldLabel('Assignment name')}${textInput('name', S.name)}</div>` : '');
  const pacingField = () =>
    act().pacing
      ? `<div class="flex items-center justify-between gap-3">${label('Pacing')}${seg('pacing', [{ v: 'student', t: 'Self-paced' }, { v: 'teacher', t: 'Teacher-paced (live)' }], S.pacing)}</div>`
      : '';

  /* ---------- rules ---------- */
  const memBar = () => {
    if (!act().rules || S.activity !== 'quiz') return '';
    if (S.mem === 'A') {
      const same = JSON.stringify(S.rules) === JSON.stringify(LAST_USED);
      return `<div class="flex items-center justify-between gap-2 rounded-lg bg-slate-50 border border-slate-100 px-3 py-2"><span class="flex items-center gap-2 text-xs font-semibold text-slate-700">${ic('rotate-ccw', 'w-3.5 h-3.5 text-brand-blue-primary')}${same ? 'Same as last time' : 'Changed from last time'}</span><span class="flex items-center">${same ? '' : btnText('Use last time', 'useLast')}${btnText('Use defaults', 'useDefaults')}</span></div>`;
    }
    const opts = [{ v: '', t: 'Presets' }, ...S.userPresetsFor().map((p) => ({ v: p.id, t: p.label }))];

  };

<script>
/* Three stepper variants for the Assign flow. Shares state and controls with ../assign-modal/app.js. */
(() => {
  const P = window.__proto;
  const { S, ic, $, getPath, setPath, sel, act, spreadAll, rulesSummary, whenSummary, modsSummary, ACT, LAST_USED, clone, ROSTER, TODAY } = P;
  const U = P.UI;

  const T = { glSubmit: false, v: 'C', step: 1, menu: null, toast: '', open: true, whenChoice: 'today', strict: 'last', moreFb: false };
  const VARIANTS = [
    { id: 'A', label: 'A Small steps' },
    { id: 'B', label: 'B Questions' },
    { id: 'C', label: 'C Accordion' },

  /* ---------- compact controls ---------- */
  const classText = () => {
    const s = sel();
    if (!s.length) return 'No classes (link only)';
    if (s.length === S.classes.length) return `All ${s.length} classes`;

  const classPicker = () =>
    `<div class="relative" data-menu-root><button type="button" data-act="menu" data-id="classes" aria-haspopup="listbox" aria-expanded="${T.menu === 'classes'}" class="flex h-9 w-full items-center gap-2 rounded-lg border border-slate-300 bg-white px-3 text-sm text-slate-800 hover:border-slate-400 focus:outline-none focus:border-brand-blue-primary">${ic('users', 'w-4 h-4 shrink-0 text-slate-500')}<span class="min-w-0 flex-1 truncate text-left">${classText()}</span>${ic('chevron-down', 'w-4 h-4 shrink-0 text-slate-400')}</button>${

  const timeRow = () =>

  const focusRows = () => {
    const r = S.rules;
    const sub = r.focus
      ? `<div class="ml-1 space-y-1.5 border-l-2 border-slate-100 pl-3">${U.toggleRow('Auto-submit after repeated tab switches', 'rules.tabAuto', '', { sub: true })}${r.tabAuto ? U.row(U.subLabel('Warnings before auto-submit'), U.numInput('rules.warnings', r.warnings, { min: 1, max: 10, w: 'w-14' })) : ''}${U.toggleRow('Auto-submit if away too long', 'rules.away', '', { sub: true })}</div>`
      : '';
    return `${U.toggleRow('Focus mode', 'rules.focus')}${sub}${U.toggleRow('Block copy and paste', 'rules.blockCopy')}`;
  };
  const shuffleRows = () => `${U.toggleRow('Shuffle questions', 'rules.shuffleQ')}${U.toggleRow('Shuffle answer options', 'rules.shuffleA')}`;
  const feedbackRows = () =>
    [
      U.toggleRow('Show score on submit', 'rules.showScore'),
      U.toggleRow('Show right and wrong to students', 'rules.showRW'),
      U.toggleRow('Reveal correct answer to students', 'rules.reveal', '', { disabled: !S.rules.showRW }),
      U.toggleRow('Group results by learning target', 'rules.groupLT'),
      U.toggleRow('Allow students to raise a hand', 'rules.raiseHand'),
    ].join('');
  const FC_DEFAULT = { mode: 'flashcards', showFirst: 'term', strict: false, mc: true, fib: true, count: 'all', mastery: 3, scoreVis: 'none' };
  const FC_MODES = { flashcards: 'Flashcards', write: 'Write', test: 'Test' };
  const FC_SCORE = [{ v: 'none', t: 'Hide until I publish' }, { v: 'score', t: 'Score only' }, { v: 'score-and-answers', t: 'Score and correct answers' }];
  const flashRows = () => {

      ? `${U.row(U.label('Question types'), '<span></span>')}<div class="ml-1 space-y-1.5 border-l-2 border-slate-100 pl-3">${U.toggleRow('Multiple choice', 'fc.mc', '', { sub: true })}${U.toggleRow('Fill in the blank', 'fc.fib', '', { sub: true })}</div>${U.row(U.label('Questions'), U.select('fc.count', [{ v: '5', t: '5' }, { v: '10', t: '10' }, { v: '15', t: '15' }, { v: 'all', t: 'All (24)' }], f.count, 'w-28'))}`
      : '';
    const mastery = f.mode === 'flashcards'
      ? `<div title="Correct answers in a row before a card counts as mastered">${U.row(U.label('Correct in a row to master'), U.numInput('fc.mastery', f.mastery, { min: 2, max: 4, w: 'w-16' }))}</div>`
      : '';
    return `<div class="space-y-3">${U.row(U.label('Mode'), U.seg('fc.mode', Object.entries(FC_MODES).map(([v, t]) => ({ v, t })), f.mode))}${U.row(U.label('Show first'), U.seg('fc.showFirst', [{ v: 'term', t: 'Term' }, { v: 'definition', t: 'Definition' }], f.showFirst))}${strict}${test}${mastery}${U.row(U.label('Score visibility'), U.select('fc.scoreVis', FC_SCORE, f.scoreVis, 'w-56'))}</div>`;
  };
  const fcText = () => `${FC_MODES[S.fc.mode]}, ${FC_SCORE.find((o) => o.v === S.fc.scoreVis).t.toLowerCase()}`;

  const fbLevel = () => {
    const r = S.rules;
    if (r.showScore && r.showRW && r.reveal) return 'all';

    if (!r.showRW && !r.reveal) return 'none';

    rw: { t: 'Their score and which answers were right', set: { showScore: true, showRW: true, reveal: false } },

  const STRICT = {

    locked: { t: 'Locked down', d: () => '1 attempt, focus mode, no copy and paste, shuffled', set: { attempts: 1, timeOn: false, focus: true, tabAuto: true, blockCopy: true, shuffleQ: true, shuffleA: true } },
    relaxed: { t: 'Relaxed', d: () => 'Unlimited attempts, no focus mode', set: { attempts: 0, timeOn: false, focus: false, tabAuto: false, away: false, blockCopy: false, shuffleQ: false, shuffleA: false } },
    custom: { t: 'Custom', d: () => 'Pick each setting' },

  const isQuizRules = () => S.activity === 'quiz' && S.when !== 'study';

  /* ---------- step lists ---------- */
  const reviewLine = (k, v, step) =>
    `<div class="flex items-start gap-4 border-b border-slate-100 py-2.5"><div class="w-28 shrink-0 pt-0.5 text-xxs font-bold uppercase tracking-widest text-slate-400">${k}</div><div class="min-w-0 flex-1 text-sm font-medium text-slate-800">${v}</div>${step ? `<button type="button" data-act="goto" data-n="${step}" class="text-xs font-bold text-brand-blue-primary hover:underline">Edit</button>` : ''}</div>`;

  function stepsA() {

      { id: 'classes', q: 'Which classes?', body: () => `<div class="space-y-3">${pacing()}${classPicker()}${modsLink()}</div>` },

    }
    if (S.activity === 'flash' && S.when !== 'study') s.push({ id: 'check', short: 'Check', q: 'How are students checked?', body: () => rows(flashRows()) });
    s.push({ id: 'review', short: 'Review', q: 'Check and assign', body: () => reviewBody(s) });
    return s;
  }

  const whenC = () => {
    if (live()) return `<p class="flex items-center gap-2 text-sm font-medium text-slate-700">${ic('pause', 'w-4 h-4 text-brand-blue-primary')}Starts paused. You start it from the board.</p>`;
    if (S.when === 'study') return `<div class="space-y-3">${dateRows()}${perClassLink()}</div>`;
    return `<div class="space-y-3">${U.seg('when', [{ v: 'scheduled', t: 'Scheduled' }, { v: 'manual', t: 'Manual' }], S.when, 'w-full [&>button]:flex-1')}${S.when === 'manual' ? manualFields() : `${dateRows()}${perClassLink()}${afterClose()}`}</div>`;
  };
  const kindSwitch = () =>
    `<div role="radiogroup" aria-label="Student work" class="grid grid-cols-2 rounded-lg bg-slate-100 p-1">${[['work', 'Students submit work', 'pen-line'], ['study', 'Study resource', 'book-open']]
      .map(([k, t, i]) => {
        const on = (S.when === 'study') === (k === 'study');
        return `<button type="button" role="radio" aria-checked="${on}" data-act="kind" data-val="${k}" class="flex h-9 items-center justify-center gap-2 rounded-md text-sm font-semibold ${on ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'}">${ic(i, 'w-4 h-4')}${t}</button>`;
      })
      .join('')}</div>`;
  const pacingSwitch = () =>
    `<div role="radiogroup" aria-label="Pacing" class="grid grid-cols-2 rounded-lg bg-slate-100 p-1">${[['student', 'Self-paced', 'user'], ['teacher', 'Teacher-paced (live)', 'play']]
      .map(([k, t, i]) => {
        const on = S.pacing === k;
        return `<button type="button" role="radio" aria-checked="${on}" data-act="set" data-path="pacing" data-val="${k}" class="flex h-9 items-center justify-center gap-2 rounded-md text-sm font-semibold ${on ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'}">${ic(i, 'w-4 h-4')}${t}</button>`;
      })
      .join('')}</div>`;
  const glLocked = () => S.activity === 'gl' && !T.glSubmit;
  const topSwitch = () => (act().pacing ? pacingSwitch() : canStudy() && !glLocked() ? kindSwitch() : '');
  function stepsC() {
    const study = S.when === 'study';
    const s = [
      { id: 'classes', t: live() ? 'Class' : 'Classes', v: classText, body: () => `<div class="space-y-3">${classPicker()}${modsLink()}</div>` },
      { id: 'when', t: study ? 'Available' : 'When', v: () => (live() ? 'You start it from the board' : whenSummary()), body: whenC },
    ];
    if (S.activity === 'quiz' && !study) {
      s.push({ id: 'rules', t: 'Attempts and order', v: () => rulesSummary({ ...S.rules, focus: false, blockCopy: false }), body: () => rows(attemptsRow(), timeRow(), shuffleRows()) });
      s.push({ id: 'integrity', t: 'Quiz integrity', v: () => [S.rules.focus && 'Focus mode', S.rules.blockCopy && 'No copy and paste'].filter(Boolean).join(', ') || 'Off', body: () => rows(focusRows()) });
      s.push({ id: 'feedback', t: 'What students see', v: fbText, body: () => rows(feedbackRows()) });
    }
    if (S.activity === 'flash' && !study) s.push({ id: 'check', t: 'How students are checked', v: fcText, body: flashRows });
    if (act().plc && !study) s.push({ id: 'share', t: 'Sharing', v: () => (S.plc.on ? `Shared with ${S.plc.which}` : 'Not shared'), body: () => U.plcRow() });
    return s;
  }

  /* ---------- layouts ---------- */
  const footerNav = (n) => {
    const left = T.step > 1 ? U.ghostBtn(`${ic('arrow-left', 'w-4 h-4')}Back`, 'back') : '<span></span>';
    const right =
      T.step === n
        ? U.assignBtn()
        : `<span class="flex items-center gap-2">${U.outlineBtn(`${ic('rocket', 'w-4 h-4')}Assign now`, 'assign')}${U.primaryBtn(`Next${ic('arrow-right', 'w-4 h-4')}`, 'next')}</span>`;
    return left + right;
  };
  const clamp = (n) => { if (T.step > n) T.step = n; };

  function layoutA() {
    const s = stepsA(); clamp(s.length);
    const cur = s[T.step - 1];
    const bar = `<div class="shrink-0 px-6 pt-4"><div class="flex items-center justify-between text-xs font-semibold text-slate-500"><span>Step ${T.step} of ${s.length}</span></div><div class="mt-2 flex gap-1">${s.map((x, i) => `<button type="button" data-act="goto" data-n="${i + 1}" aria-label="${x.q}" ${i + 1 > T.step ? 'disabled' : ''} class="h-1.5 flex-1 rounded-full ${i + 1 <= T.step ? 'bg-brand-blue-primary' : 'bg-slate-200'}"></button>`).join('')}</div></div>`;
    const body = `<h3 class="mb-4 text-base font-bold text-slate-800">${cur.q}</h3>${cur.body()}`;
    return U.shell({ width: 'max-w-lg', h: 'h-[min(34rem,100%)]', sub: bar, body, footer: footerNav(s.length) });
  }
  function layoutB() {
    const s = stepsB(); clamp(s.length);
    const cur = s[T.step - 1];
    const crumbs = `<ol class="flex shrink-0 items-center gap-1.5 border-b border-slate-100 px-6 py-2.5">${s.map((x, i) => {
      const n = i + 1, curr = n === T.step, done = n < T.step;
      return `<li class="flex items-center gap-1.5"><button type="button" data-act="goto" data-n="${n}" ${n > T.step ? 'disabled' : ''} class="flex items-center gap-1 text-xs font-bold ${curr ? 'text-brand-blue-primary' : done ? 'text-slate-600 hover:text-slate-800' : 'text-slate-400'}">${done ? ic('check', 'w-3.5 h-3.5 text-brand-blue-primary') : ''}${x.short}</button>${n < s.length ? ic('chevron-right', 'w-3.5 h-3.5 text-slate-300') : ''}</li>`;
    }).join('')}</ol>`;
    const body = `<h3 class="mb-4 text-lg font-bold text-slate-800">${cur.q}</h3>${cur.body()}`;
    return U.shell({ width: 'max-w-xl', h: 'h-[min(42rem,100%)]', sub: crumbs, body, footer: footerNav(s.length) });
  }
  function layoutC() {
    const s = stepsC(); clamp(s.length);
    const body = `${topSwitch() ? `${topSwitch()}<div class="mt-4"></div>` : ''}<div class="space-y-1.5">${s.map((x, i) => {
      const n = i + 1, open = n === T.step && !x.off;
      const head = `<button type="button" data-act="goto" data-n="${n}" aria-expanded="${open}" ${x.off ? 'disabled' : ''} class="flex w-full items-center gap-3 px-4 py-2.5 text-left ${x.off ? 'cursor-default opacity-50' : ''}"><span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full text-xs font-bold ${open ? 'border-2 border-brand-blue-primary bg-white text-brand-blue-primary' : 'bg-slate-100 text-slate-500'}">${n}</span><span class="text-sm font-bold ${open ? 'text-brand-blue-dark' : 'text-slate-700'}">${x.t}</span>${open ? '' : `<span class="ml-auto min-w-0 truncate pl-4 text-xs text-slate-500">${x.v()}</span>`}</button>`;
      const inner = open ? `<div class="space-y-4 px-4 pb-4 pl-[3.25rem]">${x.body()}${s.slice(n).some((y) => !y.off) ? `<div class="flex justify-end">${U.primaryBtn(`Continue${ic('arrow-right', 'w-4 h-4')}`, 'next', '!px-4 !py-1.5')}</div>` : ''}</div>` : '';
      return `<div class="rounded-xl border ${open ? 'border-brand-blue-primary/40 bg-white shadow-sm' : 'border-slate-200 bg-white'}">${head}${inner}</div>`;
    }).join('')}</div>`;
    return U.shell({ width: 'max-w-xl', h: 'h-[min(46rem,100%)]', body, footer: `<span></span>${live() ? U.primaryBtn(`${ic('play', 'w-4 h-4')}Start live`, 'assign') : U.assignBtn()}` });
  }

  /* ---------- host ---------- */
  const darkSeg = (a, opts, value) =>
    `<div class="inline-flex rounded-lg bg-white/10 p-1">${opts.map((o) => `<button type="button" data-act="${a}" data-val="${o.v}" aria-pressed="${value === o.v}" class="h-7 rounded-md px-3 text-xs font-semibold ${value === o.v ? 'bg-white text-slate-900 shadow-sm' : 'text-white/80 hover:text-white'}">${o.t}</button>`).join('')}</div>`;
  const toolbar = () =>
    `<div class="text-sm font-bold">Assign stepper variants</div><div class="flex items-center gap-2"><span class="text-xxs font-bold uppercase tracking-widest text-white/50">Stepper</span>${darkSeg('variant', VARIANTS.map((v) => ({ v: v.id, t: v.label })), T.v)}</div><div class="flex items-center gap-2"><span class="text-xxs font-bold uppercase tracking-widest text-white/50">Activity</span>${darkSeg('activity', Object.entries(ACT).map(([v, a]) => ({ v, t: a.short })), S.activity)}</div><div class="flex items-center gap-2"><span class="text-xxs font-bold uppercase tracking-widest text-white/50">Admin: GL submissions</span>${darkSeg('glSubmit', [{ v: 'off', t: 'Off' }, { v: 'on', t: 'On' }], T.glSubmit ? 'on' : 'off')}</div>`;
  const backdrop = () => {
    const names = ['Cell Division Video', 'Sample Quiz', 'Unit 3 Vocabulary', 'Parts of a Cell', 'Photosynthesis Quiz', 'Ecosystems Review', 'Lab Safety', 'Periodic Table'];
    return `<div class="absolute inset-0 overflow-hidden p-8"><div class="mx-auto max-w-5xl"><div class="mb-6 flex items-center gap-3"><div class="h-8 w-40 rounded-lg bg-slate-200"></div><div class="h-8 w-24 rounded-lg bg-slate-200"></div></div><div class="grid grid-cols-4 gap-4">${names.map((n) => `<div class="rounded-2xl border border-slate-200 bg-white p-4"><div class="h-16 rounded-lg bg-brand-blue-lighter"></div><div class="mt-3 truncate text-sm font-bold text-slate-800">${n}</div><div class="mt-1 h-2 w-20 rounded bg-slate-100"></div><button type="button" data-act="reopen" class="mt-3 inline-flex items-center gap-1 rounded-lg bg-brand-blue-primary px-3 py-1.5 text-xs font-bold text-white">Assign</button></div>`).join('')}</div></div></div>`;
  };

  function render() {
    const keep = {};
    document.querySelectorAll('[data-scroll]').forEach((el) => (keep[el.dataset.scroll] = el.scrollTop));
    $('#toolbar').innerHTML = toolbar();
    const modal = T.open ? { A: layoutA, B: layoutB, C: layoutC }[T.v]() : '';
    $('#stage').innerHTML = `${backdrop()}${T.open ? `<div class="absolute inset-0 flex items-center justify-center bg-slate-900/50 p-4 backdrop-blur-sm">${modal}</div>` : ''}${T.toast ? `<div class="absolute bottom-6 left-1/2 -translate-x-1/2 rounded-xl bg-slate-900 px-4 py-2.5 text-sm font-semibold text-white shadow-2xl">${T.toast}</div>` : ''}`;
    document.querySelectorAll('[data-scroll]').forEach((el) => { if (keep[el.dataset.scroll] != null) el.scrollTop = keep[el.dataset.scroll]; });
    if (T.v === 'C' && T.scrollOpen) { T.scrollOpen = false; document.querySelector('[data-scroll=body] [aria-expanded=true]')?.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
  }

  /* ---------- events ---------- */
  const syncChoices = () => {
    T.fb = fbLevel();
    T.whenChoice = S.when === 'manual' ? 'manual' : S.when === 'study' ? 'study' : T.whenChoice === 'schedule' ? 'schedule' : 'today';
  };
  const after = (path) => {
    if (path === 'pacing') {
      if (S.pacing === 'teacher') { S.when = 'manual'; const first = sel()[0] || S.classes[0]; S.classes.forEach((c) => (c.on = c === first)); }
      else S.when = 'scheduled';
    }
    if (path === 'each' && S.each) spreadAll();
    if (path.startsWith('rules.') && !path.startsWith('rules.show') && path !== 'rules.reveal' && path !== 'rules.groupLT' && path !== 'rules.raiseHand') T.strict = 'custom';
    syncChoices();
  };
  const choose = (g, id) => {
    T[g] = id;
    if (g === 'whenChoice') {
      if (id === 'today') { S.when = 'scheduled'; S.each = false; S.win.all = { o: { day: TODAY, time: 'bell' }, c: { day: TODAY, time: 'bell' } }; }
      if (id === 'schedule') S.when = 'scheduled';
      if (id === 'manual') S.when = 'manual';
      if (id === 'study') S.when = 'study';
    }
    if (g === 'strict') {
      if (id === 'last') S.rules = { ...S.rules, ...pick(LAST_USED) };
      else if (STRICT[id].set) S.rules = { ...S.rules, ...STRICT[id].set };
    }
    if (g === 'fb') S.rules = { ...S.rules, ...FB[id].set };
  };
  const pick = (r) => { const { showScore, showRW, reveal, groupLT, raiseHand, ...rest } = r; return rest; };
  const actions = {
    kind: (d) => { if (d.val === 'study') { if (S.when !== 'study') T.lastWhen = S.when; S.when = 'study'; } else S.when = T.lastWhen || 'scheduled'; T.step = Math.min(T.step, 2); syncChoices(); },
    variant: (d) => { T.v = d.val; T.step = 1; S.view = 'main'; T.menu = null; },
    activity: (d) => { S.activity = d.val; S.name = ACT[d.val].title; T.step = 1; S.view = 'main'; S.when = 'scheduled'; S.flash = clone(P.DEFAULT_FLASH); S.fc = { ...FC_DEFAULT }; S.pacing = 'student'; T.whenChoice = 'today'; S.classes.forEach((c) => (c.on = true)); if (d.val === 'gl' && !T.glSubmit) S.when = 'study'; },
    glSubmit: (d) => { T.glSubmit = d.val === 'on'; if (S.activity === 'gl') { S.when = T.glSubmit ? 'scheduled' : 'study'; T.step = 1; } },
    menu: (d) => { T.menu = T.menu === d.id ? null : d.id; },
    cls: (d) => { const c = S.classes.find((x) => x.id === d.id); if (live()) { S.classes.forEach((x) => (x.on = x === c)); T.menu = null; } else c.on = !c.on; },
    clsAll: () => S.classes.forEach((c) => (c.on = true)),
    clsClear: () => S.classes.forEach((c) => (c.on = false)),
    toggle: (d) => { setPath(S, d.path, !getPath(S, d.path)); after(d.path); },
    set: (d) => { const v = d.type === 'number' ? Number(d.val) : d.type === 'bool' ? d.val === 'true' : d.val; setPath(S, d.path, v); after(d.path); },
    bell: (d) => setPath(S, d.path, 'bell'),
    choose: (d) => choose(d.group, d.id),
    moreFb: () => { T.moreFb = !T.moreFb; },
    goto: (d) => { T.step = Number(d.n); T.menu = null; T.scrollOpen = true; },
    next: () => { T.step += 1; if (T.v === 'C') { const st = stepsC(); while (st[T.step - 1] && st[T.step - 1].off) T.step += 1; } T.menu = null; T.scrollOpen = true; },
    back: () => { T.step = Math.max(1, T.step - 1); T.menu = null; },
    mods: () => { S.view = 'mods'; T.menu = null; },
    modsBack: () => { S.view = 'main'; },
    modOpen: (d) => { S.mods[Number(d.i)].open = !S.mods[Number(d.i)].open; },
    modRemove: (d) => { S.mods.splice(Number(d.i), 1); },
    clearMods: () => { S.mods = []; },
    generate: () => { S.generating = true; setTimeout(() => { S.ruReady = true; S.generating = false; render(); }, 900); },
    assign: () => { T.open = false; T.toast = sel().length ? `Assigned to ${sel().length} class${sel().length > 1 ? 'es' : ''}` : 'Link created'; },
    cancel: () => { T.open = false; T.toast = ''; },
    reopen: () => { T.open = true; T.toast = ''; T.step = 1; S.view = 'main'; },
  };
  document.body.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act]');
    if (!t) {
      if (T.menu && !e.target.closest('[data-menu-root]')) { T.menu = null; render(); }
      return;
    }
    if (T.menu && !t.closest('[data-menu-root]')) T.menu = null;
    const fn = actions[t.dataset.act];
    if (!fn) return;
    fn(t.dataset, t);
    render();
  });
  document.body.addEventListener('change', (e) => {
    const t = e.target.closest('[data-bind]');
    if (!t) return;
    const path = t.dataset.bind;
    let v = t.value;
    if (t.dataset.type === 'number') v = Number(v);
    if (t.dataset.type === 'time' && v === 'set') v = t.dataset.side === 'o' ? '08:00' : '15:00';
    if (path === 'addMod') {
      const r = ROSTER.find((x) => x.id === v);
      if (r) S.mods.push({ id: r.id, cls: (sel()[0] || S.classes[0]).id, name: r.name, readAloud: false, lang: 'en', skip: false, open: true });
    } else {
      setPath(S, path, v);
      if (path.startsWith('win.all.') && T.whenChoice === 'today') T.whenChoice = 'schedule';
      after(path);
    }
    render();
  });

  S.mem = 'A';
  S.fc = { ...FC_DEFAULT };
  P.resetForMem();
  syncChoices();
  render();
})();

</script>
</body>
</html>
