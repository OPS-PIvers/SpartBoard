<title>SpartBoard Gradebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap"
/>
<style>
  /* Layout: full-screen teacher page, header + toolbar, one scrolling grid with pinned name and Overall columns; student and analysis views are card grids. */
  :root {
    --bg: #f3f5fa;
    --surface: #ffffff;
    --surface-2: #eceff7;
    --line: #dce1ec;
    --fg: #18203a;
    --muted: #5a6382;
    --accent: #2d3f89;
    --accent-soft: #e4e8f6;
    --brand-red: #ad2122;
    --prof: #1d8455;
    --appr: #a86a10;
    --beg: #c0392b;
    --violet: #6d4bc2;
    --teal: #127a86;
    --slate: #64708f;
    --shadow: 0 10px 30px rgba(24, 32, 58, 0.14);
    --font: 'Lexend', 'Segoe UI', system-ui, sans-serif;
    --r: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --bg: #0e1322;
      --surface: #161c30;
      --surface-2: #1e2640;
      --line: #2b3452;
      --fg: #e7eaf5;
      --muted: #9ba4c2;
      --accent: #93a6ec;
      --accent-soft: #232e5c;
      --brand-red: #f07a7a;
      --prof: #3fcf8e;
      --appr: #f0b541;
      --beg: #f27468;
      --violet: #b69cff;
      --teal: #4fd1dd;
      --slate: #9aa6c6;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      color-scheme: dark;
    }
  }
  :root[data-theme='dark'] {
    --bg: #0e1322;
    --surface: #161c30;
    --surface-2: #1e2640;
    --line: #2b3452;
    --fg: #e7eaf5;
    --muted: #9ba4c2;
    --accent: #93a6ec;
    --accent-soft: #232e5c;
    --brand-red: #f07a7a;
    --prof: #3fcf8e;
    --appr: #f0b541;
    --beg: #f27468;
    --violet: #b69cff;
    --teal: #4fd1dd;
    --slate: #9aa6c6;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    font-size: 14px;
    padding-inline: 16px;
    padding-block: 12px 40px;
    font-variant-numeric: tabular-nums;
  }
  button, select, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .proto-note {
    font-size: 12px; color: var(--muted); margin: 0 0 10px;
  }
  .app { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .brand { font-weight: 600; font-size: 18px; display: flex; align-items: center; gap: 8px; }
  .brand .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--accent); }
  .tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 999px; }
  .tabs button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; color: var(--muted); font-weight: 500; }
  .tabs button[aria-selected='true'] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .spacer { flex: 1; }
  .ctl { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
  select, input[type='number'], input[type='text'], textarea {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; color: var(--fg);
  }
  .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
  .btn.ghost { background: transparent; }
  .btn.danger { color: var(--beg); }
  .btn[aria-pressed='true'] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: var(--surface); padding: 5px 10px; font-size: 13px; color: var(--muted); }
  .seg button[aria-pressed='true'] { background: var(--accent-soft); color: var(--accent); font-weight: 500; }

  /* Grid */
  .gridwrap { overflow: auto; max-height: min(72vh, 760px); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
  table.gb { border-collapse: separate; border-spacing: 0; min-width: 100%; }
  .gb th, .gb td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 0; background: var(--surface); }
  .gb thead th { position: sticky; top: 0; z-index: 3; vertical-align: bottom; }
  .gb tfoot th, .gb tfoot td { position: sticky; bottom: 0; z-index: 3; background: var(--surface-2); font-size: 12px; color: var(--muted); padding: 6px 8px; text-align: center; border-top: 1px solid var(--line); }
  .gb .namecol { position: sticky; left: 0; z-index: 4; width: 200px; min-width: 200px; max-width: 200px; text-align: left; }
  .gb thead .namecol, .gb tfoot .namecol { z-index: 6; }
  .gb .overall { position: sticky; left: 200px; z-index: 4; width: 84px; min-width: 84px; border-right: 2px solid var(--line); }
  .gb thead .overall, .gb tfoot .overall { z-index: 6; }
  .namehead { display: flex; gap: 6px; padding: 8px 10px; align-items: center; }
  .namehead button { border: 0; background: transparent; font-weight: 600; padding: 0; }
  .namehead small { color: var(--muted); font-weight: 400; }
  .ahead { border: 0; background: transparent; width: 104px; text-align: left; padding: 8px 8px 8px; display: flex; flex-direction: column; gap: 3px; }
  .ahead:hover { background: var(--surface-2); }
  .atitle { font-weight: 600; font-size: 12.5px; line-height: 1.25; text-wrap: balance; }
  .ameta { font-size: 11px; color: var(--muted); }
  .kind { display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
  .kind i { font-style: normal; width: 16px; height: 16px; border-radius: 4px; display: inline-grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-size: 10px; font-weight: 700; }
  .unpub { color: var(--appr); }
  .srow { display: flex; flex-direction: column; padding: 6px 10px; gap: 2px; }
  .sname { border: 0; background: transparent; padding: 0; text-align: left; font-weight: 500; }
  .sname:hover { color: var(--accent); text-decoration: underline; }
  .smeta { font-size: 11px; color: var(--muted); display: flex; gap: 8px; }
  .smeta .m { color: var(--beg); }
  .cell { position: relative; width: 104px; height: 42px; border: 0; background: transparent; display: grid; place-items: center; font-size: 14px; font-weight: 500; }
  .cell:hover { box-shadow: inset 0 0 0 2px var(--accent-soft); }
  .cell:focus-visible, .cell.focus { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }
  .cell[data-band='p'] .v { color: var(--prof); }
  .cell[data-band='a'] .v { color: var(--appr); }
  .cell[data-band='b'] .v { color: var(--beg); }
  .cell .v.live { font-style: italic; text-decoration: underline dotted var(--appr); text-underline-offset: 3px; }
  .cell .v.ovr { color: var(--accent); font-weight: 700; }
  .cell .sub { font-size: 10.5px; color: var(--muted); font-weight: 400; }
  .cell .await { font-size: 11px; color: var(--appr); font-weight: 500; }
  .cell .empty { color: var(--muted); font-weight: 300; }
  .cell.na { background: repeating-linear-gradient(135deg, var(--surface-2) 0 6px, transparent 6px 12px); color: var(--muted); font-size: 11px; font-weight: 400; }
  .chips { position: absolute; top: 3px; right: 3px; display: flex; gap: 2px; }
  .chip { font-style: normal; font-size: 9.5px; font-weight: 700; min-width: 15px; height: 15px; padding: 0 3px; border-radius: 4px; display: inline-grid; place-items: center; color: var(--surface); background: var(--c); }
  .chip.auto { background: transparent; color: var(--c); box-shadow: inset 0 0 0 1.5px var(--c); }
  .cdot { position: absolute; left: 0; bottom: 0; width: 0; height: 0; border-left: 9px solid var(--slate); border-top: 9px solid transparent; }
  .cdot.shared { border-left-color: var(--accent); }
  .att { position: absolute; bottom: 3px; right: 5px; font-size: 9.5px; color: var(--muted); }
  .ovcell { font-size: 14px; font-weight: 600; text-align: center; padding: 6px; }
  .ovcell small { display: block; font-size: 10.5px; font-weight: 400; color: var(--muted); }
  .ovhead { border: 0; background: transparent; font-weight: 600; padding: 8px; width: 100%; }

  /* Popover, modal, toast */
  .pop { position: fixed; z-index: 50; width: min(360px, calc(100vw - 24px)); max-height: calc(100vh - 24px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .pop h3 { margin: 0; font-size: 15px; }
  .pop .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .psec { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; }
  .psec > label, .psec .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .strike { text-decoration: line-through; color: var(--muted); }
  .badge { font-size: 11px; padding: 2px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 500; }
  .badge.warn { background: color-mix(in srgb, var(--appr) 18%, transparent); color: var(--appr); }
  .badge.bad { background: color-mix(in srgb, var(--beg) 15%, transparent); color: var(--beg); }
  .badge.good { background: color-mix(in srgb, var(--prof) 15%, transparent); color: var(--prof); }
  .fchip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px 4px 6px; font-size: 12.5px; display: inline-flex; gap: 6px; align-items: center; }
  .fchip .chip { position: static; }
  .fchip[aria-pressed='true'] { border-color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); }
  .fchip em { font-style: normal; font-size: 10.5px; color: var(--muted); }
  textarea { width: 100%; min-height: 56px; resize: vertical; }
  .confirm { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; font-size: 13px; display: flex; flex-direction: column; gap: 8px; }
  .hist { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; margin: 0; padding-left: 16px; }
  .scrim { position: fixed; inset: 0; background: rgba(10, 14, 28, .45); z-index: 60; display: grid; place-items: center; padding: 16px; }
  .modal { background: var(--bg); border-radius: 14px; box-shadow: var(--shadow); width: min(980px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .modal.side { width: min(560px, 100%); }
  .modal header { display: flex; align-items: center; gap: 10px; }
  .modal h2 { margin: 0; font-size: 18px; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: 10px; z-index: 80; display: flex; gap: 12px; align-items: center; font-size: 13px; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }
  .toast button { background: transparent; border: 0; color: var(--bg); font-weight: 600; text-decoration: underline; }

  /* Cards */
  .cards { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; grid-column: span 6; }
  .card.w12 { grid-column: span 12; } .card.w4 { grid-column: span 4; } .card.w8 { grid-column: span 8; } .card.w3 { grid-column: span 3; }
  .card h3 { margin: 0; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .card h3 .spacer { flex: 1; }
  .cardctl { display: inline-flex; gap: 4px; }
  .cardctl button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; font-size: 11px; padding: 2px 6px; }
  .kpi { display: flex; flex-direction: column; gap: 2px; }
  .kpi b { font-size: 26px; font-weight: 600; }
  .kpi span { font-size: 12px; color: var(--muted); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .bars { display: flex; flex-direction: column; gap: 6px; }
  .bar { display: grid; grid-template-columns: minmax(90px, 34%) 1fr 52px; gap: 8px; align-items: center; font-size: 12.5px; }
  .bar .track { height: 12px; background: var(--surface-2); border-radius: 4px; position: relative; overflow: hidden; }
  .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--accent); }
  .bar .fill.alt { background: color-mix(in srgb, var(--accent) 40%, transparent); top: 50%; }
  .bar .fill.main2 { bottom: 50%; }
  .bar .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .val { text-align: right; }
  svg text { fill: var(--muted); font-family: var(--font); font-size: 11px; }
  table.plain { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.plain th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 6px; border-bottom: 1px solid var(--line); }
  table.plain td { padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .tscroll { overflow-x: auto; }
  .heat { display: grid; gap: 3px; }
  .hc { height: 26px; border-radius: 5px; display: grid; place-items: center; font-size: 11px; font-weight: 600; border: 0; }
  .hc[data-band='p'] { background: color-mix(in srgb, var(--prof) 70%, transparent); color: var(--surface); }
  .hc[data-band='a'] { background: color-mix(in srgb, var(--appr) 65%, transparent); color: var(--surface); }
  .hc[data-band='b'] { background: color-mix(in srgb, var(--beg) 70%, transparent); color: var(--surface); }
  .hc[data-band='n'] { background: var(--surface-2); color: var(--muted); }
  .hl { font-size: 11.5px; display: flex; align-items: center; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .ins { display: flex; gap: 10px; align-items: flex-start; padding: 8px; border-radius: 8px; background: var(--surface-2); border: 0; text-align: left; width: 100%; }
  .ins .sev { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--c); }
  .filterbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .shead { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .shead h2 { margin: 0; font-size: 20px; }
  .empty-state { padding: 40px; text-align: center; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
  .empty-state b { display: block; color: var(--fg); font-size: 15px; margin-bottom: 4px; }

  /* Student portal */
  .portal { display: grid; grid-template-columns: 220px 1fr; gap: 14px; }
  .pside { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; display: flex; flex-direction: column; gap: 4px; }
  .pside div { padding: 8px 10px; border-radius: 8px; font-size: 13px; }
  .pside .on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .pmain { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .prow { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; }
  .prow .score { font-size: 20px; font-weight: 600; text-align: right; }
  .bubble { grid-column: 1 / -1; background: var(--surface-2); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
  .new { font-size: 10.5px; font-weight: 700; color: var(--surface); background: var(--brand-red); border-radius: 4px; padding: 1px 5px; letter-spacing: .04em; }
  .previewbar { background: var(--accent); color: var(--surface); border-radius: var(--r); padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .previewbar .btn { color: var(--fg); }

  .iconbtn { width: 34px; height: 34px; display: inline-grid; place-items: center; border: 1px solid transparent; background: transparent; border-radius: 8px; color: var(--muted); font-weight: 600; }
  .iconbtn:hover { background: var(--surface-2); color: var(--fg); }
  .iconbtn[aria-pressed='true'] { background: var(--accent-soft); color: var(--accent); }
  .count { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: var(--surface); font-size: 11px; font-weight: 600; }
  .atop { display: flex; align-items: center; gap: 6px; min-height: 18px; }
  .ki { font-style: normal; width: 18px; height: 18px; border-radius: 5px; display: inline-grid; place-items: center; background: var(--surface-2); color: var(--muted); font-size: 10px; font-weight: 700; }
  .dotpub { width: 7px; height: 7px; border-radius: 50%; background: var(--appr); }
  .mc { font-size: 11px; color: var(--beg); }
  .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  details.dsec { border-top: 1px solid var(--line); padding-top: 8px; }
  details.dsec summary { cursor: pointer; font-size: 13px; font-weight: 500; color: var(--muted); list-style: none; display: flex; justify-content: space-between; }
  details.dsec summary::-webkit-details-marker { display: none; }
  details.dsec summary::after { content: '+'; }
  details.dsec[open] summary::after { content: '\2013'; }
  details.dsec > div { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .menu { display: flex; flex-direction: column; gap: 12px; }
  .menu > div { display: flex; flex-direction: column; gap: 6px; }
  .fpill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 3px 4px 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); border: 0; }
  .fpill span { font-weight: 700; padding: 0 4px; }
  .filterbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12.5px; }
  .keys kbd { font-family: inherit; font-size: 11.5px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; justify-self: start; }
  body.privacy .pv { filter: blur(6px); }
  @media (max-width: 800px) {
    .card, .card.w4, .card.w8, .card.w3 { grid-column: span 12; }
    .portal { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .pop, .toast { animation: fade .12s ease-out; }
    @keyframes fade { from { opacity: .6; transform: translateY(2px); } }
    .toast { animation: none; }
  }
</style>

<div class="app" id="app"></div>
<div class="pop" id="pop" hidden></div>
<div id="modalRoot"></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  // ---------- Fake data ----------
  const TODAY = new Date(2026, 8, 30, 14, 0);
  const DAY = 86400000;
  const rng = (seed) => () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const hash = (s) => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return ((h >>> 0) % 10000) / 10000; };
  const due = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 23, 59); };
  const fdate = (d) => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  const TARGETS = [
    { id: 'RL.1', label: 'Cite textual evidence' },
    { id: 'RL.2', label: 'Determine a theme' },
    { id: 'RL.3', label: 'Analyze character' },
    { id: 'L.4', label: 'Vocabulary in context' },
    { id: 'W.1', label: 'Write arguments' },
  ];
  const KIND = {
    quiz: { label: 'Quiz', i: 'Q' }, video: { label: 'Video', i: 'V' }, gl: { label: 'Guided', i: 'G' },
    flash: { label: 'Flashcards', i: 'F' }, project: { label: 'Project', i: 'P' },
    mini: { label: 'Mini-app', i: 'M', completion: true }, wall: { label: 'Wall', i: 'W', completion: true },

      </tbody></table></div>
      <label class="ctl"><input type="checkbox" id="setAuto" ${st.auto ? 'checked' : ''} ${ro}/> Apply Late and Missing automatically from due dates</label></section>
      <section class="card w12"><h3>Overall grade</h3><label class="ctl"><input type="checkbox" id="setCats" ${st.useCats ? 'checked' : ''} ${ro}/> Use weighted categories</label>
        ${st.cats.map((c, n) => `<div class="row"><span style="min-width:110px">${c.name}</span><input type="number" data-set="w" data-n="${n}" value="${c.w}" min="0" max="100" style="width:70px" ${ro} aria-label="${c.name} weight"/>%</div>`).join('')}</section>
      <section class="card w12"><h3>Learning target proficiency</h3><select id="setMethod" ${ro} aria-label="Proficiency method">${opt('decay', 'Decaying average (recent counts 65%)', st.method)}${opt('mean', 'Mean of all evidence', st.method)}${opt('recent', 'Most recent', st.method)}${opt('highest', 'Highest', st.method)}</select>
        <div class="small muted">Proficient 80+ · Approaching 60–79 (from your PLC cutoffs)</div></section>
      <section class="card w12"><h3>What students see on their Grades tab</h3>
        <label class="ctl"><input type="checkbox" id="setScores" ${st.showScores ? 'checked' : ''} ${ro}/> Published scores, visible flags and shared comments</label>
        <label class="ctl"><input type="checkbox" id="setStd" ${st.showStandards ? 'checked' : ''} ${ro}/> Standards mastery</label></section>
      <div class="small muted">Grading periods come from your building (set by an admin).</div>`, true);
  }

  // ---------- Student portal ----------
  function renderPortal() {
    const s = stu(S.sid); const st = S.settings;
    const rows = ASSIGN.filter((a) => col(a.id).pub || (mark(s.id, a.id) || {}).pub).map((a) => ({ a, i: info(s.id, a.id) })).filter((x) => !x.i.na && (x.i.m.pub !== false)).reverse();
    const isNew = (a) => a.id === 'a9' || a.id === 'a7';
    return `
    <div class="previewbar"><b>Previewing as ${esc(s.first)} ${esc(s.last)}</b><span>This is exactly what the student sees.</span><span class="spacer" style="flex:1"></span><button class="btn" data-act="portal-exit">Back to gradebook</button></div>
    <div class="portal">
      <nav class="pside"><div class="muted small">My classes</div><div class="on">${cls().name}</div><div>Science 8</div><div>Math 8</div></nav>
      <div class="pmain">
        <div class="row"><h2 style="margin:0;font-size:20px">${cls().name}</h2><span class="spacer" style="flex:1"></span><div class="tabs"><button>Assignments</button><button aria-selected="true">Grades <span class="new">NEW</span></button></div></div>
        ${!st.showScores ? '<div class="empty-state"><b>No grades to show yet</b>Your teacher hasn\'t shared grades for this class.</div>' : rows.map(({ a, i }) => {
          const flags = i.flags.filter((f) => (flagDef(f.id) || {}).student);
          const shared = i.m && i.m.comment && i.m.comment.shared ? i.m.comment.text : null;
          return `<div class="prow"><div><div style="font-weight:600">${esc(a.title)} ${isNew(a) ? '<span class="new">NEW</span>' : ''}</div><div class="small muted">${KIND[a.kind].label} · due ${fdate(a.dueDate)}</div>
            <div class="row" style="margin-top:4px">${flags.map((f) => { const d = flagDef(f.id); return `<span class="badge" style="background:color-mix(in srgb, ${d.color} 15%, transparent);color:${d.color}">${d.name}</span>`; }).join('')}</div></div>
            <div class="score">${a.completion ? (i.done ? '✓' : '—') : i.excluded ? '<span class="small muted">Excused</span>' : i.pct == null ? '—' : `${+((i.pct / 100) * i.max).toFixed(1)}/${i.max}<div class="small muted" style="font-weight:400">${Math.round(i.pct)}%</div>`}</div>
            ${shared ? `<div class="bubble"><b>Teacher comment</b><br/>${esc(shared)}</div>` : ''}</div>`;
        }).join('')}
        ${st.showStandards ? `<section class="card w12"><h3>My learning targets</h3>${TARGETS.map((t) => { const p = prof(s.id, t.id); const b = band(p); return `<div class="bar"><span class="lab"><b>${t.id}</b> ${t.label}</span><span class="track"><span class="fill" style="width:${p || 0}%;background:var(--${{ p: 'prof', a: 'appr', b: 'beg', n: 'line' }[b]})"></span></span><span class="val"><span class="badge ${bandCls[b]}">${bandName[b]}</span></span></div>`; }).join('')}</section>` : `<div class="confirm small">Teacher-only note: standards mastery is off for this class. Turn it on in Settings.</div>`}
        <div class="small muted">Unpublished work, private comments and hidden flags never reach the student.</div>
      </div>
    </div>`;
  }

  // ---------- Toast ----------
  const toastEl = document.getElementById('toast'); let tt;
  function toast(msg, canUndo) { toastEl.innerHTML = `<span>${esc(msg)}</span>${canUndo ? '<button data-act="undo">Undo</button>' : ''}`; toastEl.hidden = false; clearTimeout(tt); tt = setTimeout(() => (toastEl.hidden = true), 4500); }

  // ---------- Actions ----------
  function applyCellFlag(sid, aid, fid) {
    const i = info(sid, aid); if (i.na) return;
    const m = mark(sid, aid, true); const on = i.flags.find((f) => f.id === fid); const name = flagDef(fid).name;
    pushUndo(`${name} on ${stu(sid).first}`);
    if (on && on.auto) { m.suppressed = [...(m.suppressed || []), fid]; logH(sid, aid, `Auto ${name} cleared`); }
    else if (on) { m.flags = (m.flags || []).filter((x) => x !== fid); logH(sid, aid, `Flag ${name} removed`); }
    else { m.flags = [...(m.flags || []), fid]; m.suppressed = (m.suppressed || []).filter((x) => x !== fid); logH(sid, aid, `Flag ${name} added`); }
    toast(on ? `${name} removed` : `${name} added`, true);
  }
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act]');
    if (!t) { if (!e.target.closest('#pop')) closePop(); return; }
    const act = t.dataset.act; const P = S.pop;
    if (!t.closest('#pop') && !['cell', 'head', 'edit-cell', 'undo', 'menu'].includes(act)) closePop();
    switch (act) {
      case 'tab': S.tab = t.dataset.tab; S.view = 'grid'; S.scrollToEnd = true; render(); break;
      case 'cell': { const w = document.getElementById('gridwrap'); if (w) S.gridScroll = { l: w.scrollLeft, t: w.scrollTop }; S.focus = { s: t.dataset.s, a: t.dataset.a }; S.pop = null; openCellPop(t.dataset.s, t.dataset.a, t); break; }
      case 'edit-cell': S.pop = null; openCellPop(t.dataset.s, t.dataset.a, t); break;
      case 'head': S.pop = null; openHeadPop(t.dataset.a, t); break;
      case 'student': S.view = 'student'; S.sid = t.dataset.s; S.expandTarget = null; render(); scrollTo(0, 0); break;
      case 'back': S.view = 'grid'; S.tab = 'grid'; render(); break;
      case 'stu-nav': { const l = sortedStudents(); const n = l.findIndex((s) => s.id === S.sid) + +t.dataset.d; if (l[n]) { S.sid = l[n].id; render(); } break; }
      case 'fmt': S.fmt = t.dataset.v; rerender(); break;
      case 'setname': S.nameFmt = t.dataset.v; rerender(); break;
      case 'menu': { const m = t.dataset.m; if (S.pop && S.pop.type === m) closePop(); else openMenu(m, t); break; }
      case 'an-rm': S.an[t.dataset.k] = 'all'; rerender(); break;
      case 'privacy': S.privacy = !S.privacy; render(); break;
      case 'namesort': S.sort = { key: 'name', dir: S.sort.key === 'name' ? -S.sort.dir : 1 }; rerender(); break;
      case 'sortoverall': S.sort = { key: 'overall', dir: S.sort.key === 'overall' ? -S.sort.dir : -1 }; rerender(); break;
      case 'unhide': pushUndo('Show hidden columns'); ASSIGN.forEach((a) => (col(a.id).hidden = false)); rerender(); break;
      case 'export': toast('Exported current view to CSV (Last, First · percent · flags as codes). Accommodations are never included.'); break;
      case 'settings': settingsModal(); break;
      case 'close-modal': closeModal(); render(); break;
      case 'scrim': if (e.target === t) { closeModal(); render(); } break;
      case 'undo': doUndo(); break;
      case 'toast': toast(t.dataset.msg); break;
      case 'portal': S.view = 'portal'; render(); scrollTo(0, 0); break;
      case 'portal-exit': S.view = 'student'; render(); break;
      case 'customize': S.customize = !S.customize; render(); break;
      case 'card-mv': { const n = S.cards.indexOf(t.dataset.c); const m = n + +t.dataset.d; [S.cards[n], S.cards[m]] = [S.cards[m], S.cards[n]]; saveCards(); render(); break; }
      case 'card-hide': { const c = t.dataset.c; S.hiddenCards = S.hiddenCards.includes(c) ? S.hiddenCards.filter((x) => x !== c) : [...S.hiddenCards, c]; saveCards(); render(); break; }
      case 'expand-t': S.expandTarget = S.expandTarget === t.dataset.t ? null : t.dataset.t; render(); break;
      case 'ins': if (t.dataset.s) { S.view = 'student'; S.sid = t.dataset.s; render(); } else if (t.dataset.t) { S.tab = 'analysis'; S.view = 'grid'; S.an.target = t.dataset.t; render(); } else if (t.dataset.a) { S.view = 'grid'; S.tab = 'grid'; S.needs = true; render(); } break;
      case 'analyze-a': analyzeModal(t.dataset.a); break;
      // cell popover
      case 'ov-save': { const v = parseFloat(document.getElementById('ovIn').value); const i = info(P.s, P.a); if (isNaN(v) || v < 0 || v > i.max * 2) { toast('Enter a score from 0 to ' + i.max); break; } pushUndo('Score override'); const m = mark(P.s, P.a, true); const before = i.pct == null ? 'blank' : +((i.pct / 100) * i.max).toFixed(1) + '/' + i.max; m.override = (v / i.max) * 100; logH(P.s, P.a, `Score overridden ${before} → ${v}/${i.max}`); P.prefill = null; toast('Score saved', true); rerender(); break; }
      case 'ov-revert': { pushUndo('Revert override'); const m = mark(P.s, P.a, true); delete m.override; logH(P.s, P.a, 'Override reverted to calculated score'); toast('Reverted to calculated score', true); rerender(); break; }
      case 'grade-answers': closePop(); resultsModal(P.a); break;
      case 'flag': applyCellFlag(P.s, P.a, t.dataset.f); rerender(); break;
      case 'cm-save': { pushUndo('Comment'); const m = mark(P.s, P.a, true); const text = document.getElementById('cmIn').value.trim(); const shared = document.getElementById('cmShare').checked; m.comment = text ? { text, shared } : undefined; logH(P.s, P.a, text ? `Comment saved${shared ? ', shared with student' : ''}` : 'Comment removed'); toast('Comment saved', true); rerender(); break; }
      case 'fill-start': { const v = parseFloat(document.getElementById('ovIn').value); if (isNaN(v)) { toast('Enter a score first'); break; } P.fill = v; reopen(); break; }
      case 'fill-cancel': P.fill = null; reopen(); break;
      case 'fill-go': { const i0 = info(P.s, P.a); pushUndo('Fill empty cells'); let n = 0; cls().students.forEach((x) => { const j = info(x.id, P.a); if (!j.na && j.r.state === 'none' && j.m.override == null && !j.excluded && (!j.m.flags || !j.m.flags.length || j.zeroed)) { mark(x.id, P.a, true).override = (P.fill / i0.max) * 100; logH(x.id, P.a, `Filled with ${P.fill}/${i0.max} (bulk)`); n++; } }); P.fill = null; toast(`Filled ${n} cell${n === 1 ? '' : 's'}`, true); rerender(); break; }
      case 'pub-stu': { const i = info(P.s, P.a); pushUndo('Publish for student'); const m = mark(P.s, P.a, true); m.pub = !i.pub; logH(P.s, P.a, m.pub ? 'Published for this student' : 'Unpublished for this student'); toast(m.pub ? 'Published for ' + stu(P.s).first : 'Unpublished for ' + stu(P.s).first, true); rerender(); break; }
      // header popover
      case 'open-results': closePop(); resultsModal(P.a); break;
      case 'analyze': closePop(); analyzeModal(P.a); break;
      case 'pub-col': { const c = col(P.a); pushUndo('Publish column'); c.pub = !c.pub; toast(c.pub ? `Published to ${cls().students.length} students` : 'Scores unpublished', true); rerender(); break; }
      case 'sort-col': S.sort = { key: P.a, dir: -1 }; closePop(); render(); break;
      case 'htarget': { const c = col(P.a); pushUndo('Target tags'); c.targets = c.targets.includes(t.dataset.t) ? c.targets.filter((x) => x !== t.dataset.t) : [...c.targets, t.dataset.t]; rerender(); break; }
      case 'bulk': { const k = t.dataset.k; const a = A[P.a];
        if (k === 'fill') P.bulk = { k, msg: `Fill every empty, unsubmitted cell in ${esc(a.title)} with 0/${col(P.a).maxOverride || a.max}?`, cta: 'Fill with 0' };
        if (k === 'missing') P.bulk = { k, msg: 'Flag every student with no submission as Missing? They count as 0 until work arrives.', cta: 'Mark Missing' };
        if (k === 'excuse') P.bulk = { k, msg: `Excuse ${esc(a.title)} for every student? It will be left out of everyone's average.`, cta: 'Excuse all' };
        reopen(); break; }
      case 'bulk-cancel': P.bulk = null; reopen(); break;
      case 'bulk-go': { const k = P.bulk.k; pushUndo('Column: ' + P.bulk.cta); let n = 0;
        cls().students.forEach((x) => { const j = info(x.id, P.a); if (j.na) return; const m = mark(x.id, P.a, true);
          if (k === 'fill' && j.r.state === 'none' && m.override == null && !j.excluded) { m.override = 0; n++; logH(x.id, P.a, 'Filled with 0 (bulk)'); }
          if (k === 'missing' && j.r.state === 'none' && !(m.flags || []).includes('M')) { m.flags = [...(m.flags || []), 'M']; n++; logH(x.id, P.a, 'Flag Missing added (bulk)'); }
          if (k === 'excuse' && !(m.flags || []).includes('X')) { m.flags = [...(m.flags || []), 'X']; n++; logH(x.id, P.a, 'Flag Excused added (bulk)'); } });
        P.bulk = null; toast(`Updated ${n} students`, true); rerender(); break; }
      case 'hide-col': pushUndo('Hide column'); col(P.a).hidden = true; closePop(); toast('Column hidden', true); render(); break;
      case 'push': toast(`Pushed final scores to ${A[P.a].lms} (3 awaiting grade skipped)`); break;
    }
  });
  function saveCards() { try { localStorage.setItem('gb-cards', JSON.stringify({ cards: S.cards, hidden: S.hiddenCards })); } catch (e) {} }
  document.addEventListener('change', (e) => {
    const t = e.target; const P = S.pop;
    const map = { clsSel: () => { S.cls = t.value; S.scrollToEnd = true; S.focus = null; }, periodSel: () => (S.period = t.value), fcat: () => (S.fcat = t.value), fkind: () => (S.fkind = t.value),
      sortSel: () => (S.sort = { key: t.value, dir: t.value === 'name' ? 1 : -1 }),
      anCat: () => (S.an.cat = t.value), anKind: () => (S.an.kind = t.value), anTarget: () => (S.an.target = t.value), anGroup: () => (S.an.group = t.value), anFlag: () => (S.an.flag = t.value), anAcc: () => (S.an.acc = t.value), anCompare: () => (S.an.compare = t.checked),
      exMetric: () => (S.an.metric = t.value), exBy: () => (S.an.by = t.value), wi: () => (S.whatIf = +t.value),
      tintChk: () => (S.tint = t.checked), needsChk: () => (S.needs = t.checked) };
    if (map[t.id]) { map[t.id](); if (P && MENUS.includes(P.type)) rerender(); else { closePop(); render(); } return; }
    if (P && P.type === 'head') {
      const c = col(P.a);
      if (t.id === 'hCat') { pushUndo('Category'); c.cat = t.value; }
      if (t.id === 'hCounts') { pushUndo('Counts toward overall'); c.counts = t.checked; }
      if (t.id === 'hMax') { const v = +t.value; if (v > 0) { pushUndo('Max points'); c.maxOverride = v === A[P.a].max ? null : v; } }
      if (t.id === 'hPolicy') { pushUndo('Attempt policy'); c.policy = t.value; }
      rerender(); return;
    }
    const st = S.settings;
    if (t.id === 'setSource') { st.source = t.value; if (t.value === 'plc') { st.method = 'decay'; st.flags[2].effect = 'none'; } settingsModal(); render(); return; }
    if (t.dataset.set === 'effect') { pushUndo('Flag effect'); st.flags[+t.dataset.n].effect = t.value; }
    if (t.dataset.set === 'student') st.flags[+t.dataset.n].student = t.checked;
    if (t.dataset.set === 'w') st.cats[+t.dataset.n].w = +t.value;
    if (t.id === 'setAuto') st.auto = t.checked;
    if (t.id === 'setCats') st.useCats = t.checked;
    if (t.id === 'setMethod') st.method = t.value;
    if (t.id === 'setScores') st.showScores = t.checked;
    if (t.id === 'setStd') st.showStandards = t.checked;
    render();
  });
  document.addEventListener('keydown', (e) => {
    const typing = /INPUT|TEXTAREA|SELECT/.test(e.target.tagName);
    if (e.key === 'Escape') { if (!pop.hidden) { closePop(); const c = document.querySelector('.cell.focus'); if (c) c.focus(); } else closeModal(); return; }
    if (typing) { if (e.key === 'Enter' && e.target.id === 'ovIn') { e.preventDefault(); document.querySelector('[data-act="ov-save"]').click(); } return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); doUndo(); return; }
    if (e.key.toLowerCase() === 'p' && !e.ctrlKey && !e.metaKey) { S.privacy = !S.privacy; render(); return; }
    if (S.view !== 'grid' || S.tab !== 'grid') { if (S.view === 'student' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { const b = document.querySelector(`[data-act="stu-nav"][data-d="${e.key === 'ArrowLeft' ? -1 : 1}"]`); if (b && !b.disabled) b.click(); } return; }
    const cellEl = e.target.closest && e.target.closest('.cell');
    if (!cellEl) return;
    const studs = sortedStudents(); const colsV = visibleCols();
    let r = studs.findIndex((s) => s.id === cellEl.dataset.s), c = colsV.findIndex((a) => a.id === cellEl.dataset.a);
    const moves = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
    if (moves[e.key]) {
      e.preventDefault(); closePop();
      r = clamp(r + moves[e.key][0], 0, studs.length - 1); c = clamp(c + moves[e.key][1], 0, colsV.length - 1);
      S.focus = { s: studs[r].id, a: colsV[c].id };
      document.querySelectorAll('.cell.focus').forEach((x) => { x.classList.remove('focus'); x.tabIndex = -1; });
      const n = document.querySelector(`.cell[data-s="${S.focus.s}"][data-a="${S.focus.a}"]`); n.classList.add('focus'); n.tabIndex = 0; n.focus(); n.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      return;
    }
    if (e.key === 'Enter') { e.preventDefault(); openCellPop(cellEl.dataset.s, cellEl.dataset.a, cellEl); return; }
    if (/^[0-9]$/.test(e.key) && !A[cellEl.dataset.a].completion) { e.preventDefault(); S.pop = null; openCellPop(cellEl.dataset.s, cellEl.dataset.a, cellEl, e.key); return; }
    const f = S.settings.flags.find((x) => x.id.toLowerCase() === e.key.toLowerCase());
    if (f) { e.preventDefault(); applyCellFlag(cellEl.dataset.s, cellEl.dataset.a, f.id); const s = cellEl.dataset.s, a = cellEl.dataset.a; S.focus = { s, a }; rerender(); const n = document.querySelector(`.cell[data-s="${s}"][data-a="${a}"]`); if (n) n.focus(); }
  });
  addEventListener('resize', () => { if (!pop.hidden) reopen(); });

  S.scrollToEnd = true;
  render();
})();
</script>
