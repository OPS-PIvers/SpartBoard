<!doctype html><html><head><meta charset="utf-8"><title>Posts - Seesaw-like</title><link rel="stylesheet" href="/common.css"></head>
<body>
<sb-toolbar></sb-toolbar>
<sb-dialog hidden></sb-dialog>
<main id="feed" style="max-width:900px;margin:0 auto"></main>
<script>
const css = '<style>button{font:inherit;padding:6px 12px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;cursor:pointer}.c{margin:12px 16px;padding:12px;background:#fff;border:1px solid #e2e8f0;border-radius:8px}</style>';
customElements.define('sb-toolbar', class extends HTMLElement { connectedCallback() { const r = this.attachShadow({ mode: 'open' }); r.innerHTML = css + '<div style="display:flex;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid #e2e8f0;position:sticky;top:0"><b style="margin-right:auto">Journal</b><button id="np">New post</button><button>Filter</button></div>'; r.getElementById('np').onclick = () => document.querySelector('sb-dialog').open(); } });
customElements.define('sb-dialog', class extends HTMLElement {
  connectedCallback() { const r = this.attachShadow({ mode: 'open' }); r.innerHTML = css + '<div class="c" style="position:fixed;top:20%;left:30%;z-index:9;box-shadow:0 8px 32px rgb(0 0 0/.2)" role="dialog" aria-label="New post"><p>Create a post</p><button id="att">Add attachment</button><div id="src" hidden><button>Upload</button> <button id="gd">Google Drive</button> <button>Camera</button></div><p><button id="done">Done</button></p></div>'; r.getElementById('att').onclick = () => (r.getElementById('src').hidden = false); r.getElementById('done').onclick = () => (this.hidden = true); r.getElementById('gd').onclick = () => (this.hidden = true); }
  open() { this.hidden = false; }
});
customElements.define('sb-card', class extends HTMLElement { connectedCallback() { const n = this.getAttribute('n'); const r = this.attachShadow({ mode: 'open' }); r.innerHTML = css + `<div class="c"><b>Post ${n}</b><p>Student work sample ${n}</p><button>Open</button> <button aria-label="Share post ${n}" id="sh">Share</button><div id="m" hidden><button>Copy link</button> <button>Email</button></div></div>`; r.getElementById('sh').onclick = () => (r.getElementById('m').hidden = false); } });
document.getElementById('feed').innerHTML = Array.from({ length: 300 }, (_, i) => `<sb-card n="${i + 1}"></sb-card>`).join('');
</script></body></html>
