<!doctype html><html><head><meta charset="utf-8"><title>Reports</title><link rel="stylesheet" href="/common.css"></head>
<body>
<header><h1 style="font-size:18px;margin:0 auto 0 0">Reports</h1><span id="spin" aria-hidden="true"></span></header>
<main id="app" style="max-width:900px;margin:0 auto"></main>
<script>
// A slow site: every action shows a ticking loader beside where the next control lands, for longer each time.
const app = document.getElementById('app');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const ready = () => console.debug(`[sbmain] ${JSON.stringify({ name: 'ready', t: performance.timeOrigin + performance.now() })}`);
async function loading(ms, html) {
  app.innerHTML = '<div class="panel"><span id="bar">Loading</span></div>';
  const bar = document.getElementById('bar');
  const end = performance.now() + ms;
  let n = 0;
  while (performance.now() < end) {
    bar.textContent = `Loading ${'.'.repeat(++n % 4)} ${Math.round((n * 50 * 100) / ms)}%`;
    await wait(50);
  }
  app.innerHTML = html;
  ready();
}
const page = location.pathname.endsWith('/2') ? 2 : 1;
if (page === 1) {
  loading(900, '<div class="panel"><button id="load">Load this week</button></div>');
  document.addEventListener('click', (e) => {
    if (e.target.id === 'load') loading(1500, '<div class="panel"><b>Week 12</b> <button id="open">Open attendance</button></div>');
    if (e.target.id === 'open') loading(2500, '<div class="panel"><b>Attendance</b> <a id="more" href="/slow/2">See the full report</a></div>');
  });
} else {
  loading(900, '<div class="panel"><b>Full report</b> <button id="done">Download</button></div>');
}
</script></body></html>
